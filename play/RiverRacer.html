      noise: { bp: 800, q: 0.6, gain: 0.12 },
      am: { rate: 8, rateRpm: 6, depth: 0.22, depthRpm: -0.10 },
      idle: 0.12, full: 0.32
    },
    // Screaming high-RPM race engine: rich saw stack, aggressive bandpass sweep
    f1: {
      base: 130,
      oscs: [
        { type: 'sawtooth', ratio: 1.00, detune: -5, gain: 0.40 },
        { type: 'sawtooth', ratio: 1.00, detune:  5, gain: 0.40 },
        { type: 'sawtooth', ratio: 2.00, detune: -3, gain: 0.30 },
        { type: 'sawtooth', ratio: 3.00, detune:  3, gain: 0.18 },
        { type: 'square',   ratio: 1.50, detune:  0, gain: 0.12 }
      ],
      sub: null,
      drive: 2.6,
      bpBase: 500, bpRange: 5200, bpQ: 1.6,
      lpBase: 9000,
      formant: { freq: 3200, q: 4, db: 6 },
      noise: { bp: 3500, q: 0.8, gain: 0.07 },
      am: { rate: 90, rateRpm: 80, depth: 0.06, depthRpm: 0 },
      idle: 0.10, full: 0.30
    },
    // Vintage inboard putter: low pitch, strong ~20-40Hz amplitude modulation
    runabout: {
      base: 46,
      oscs: [
        { type: 'sawtooth', ratio: 1.00, detune: -4, gain: 0.50 },
        { type: 'triangle', ratio: 1.00, detune:  4, gain: 0.35 },
        { type: 'square',   ratio: 2.00, detune:  0, gain: 0.12 }
      ],
      sub: { ratio: 0.5, gain: 0.50 },
      drive: 3.8,
      bpBase: 260, bpRange: 650, bpQ: 0.8,
      lpBase: 2200,
      formant: null,
      noise: { bp: 500, q: 0.5, gain: 0.14 },
      am: { rate: 22, rateRpm: 15, depth: 0.55, depthRpm: -0.25 },
      idle: 0.13, full: 0.30
    }
  };

  // --------------------------------------------------------------------------
  // Core lifecycle
  // --------------------------------------------------------------------------
  function doInit() {
    if (!ctx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ctx = new AC();

      comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -18;
      comp.knee.value = 12;
      comp.ratio.value = 4;
      comp.attack.value = 0.004;
      comp.release.value = 0.16;

      master = gain(masterLevel);
      master.connect(comp);
      comp.connect(ctx.destination);

      engineBus = gain(0.30); // engines (incl. spray) sit well under music + SFX
      engineBus.connect(master);
      fxBus = gain(0.9);
      fxBus.connect(master);

      ensureAmbience();
    }
    doResume();
    // music requested before the first user gesture (title screen at boot) starts now
    if (music.wantMode && !music.playing) {
      var wm = music.wantMode;
      music.wantMode = null;
      doSetMode(wm, true);
    }
  }

  function doResume() {
    if (ctx && ctx.state === 'suspended' && typeof ctx.resume === 'function') {
      var p = ctx.resume();
      if (p && typeof p.catch === 'function') p.catch(function () {});
    }
  }

  // --------------------------------------------------------------------------
  // Ambience: filtered brown noise (wind / lake wash), swells with speed+inLake
  // --------------------------------------------------------------------------
  function ensureAmbience() {
    if (ambience || !ctx) return;
    var src = noiseSource('brown');
    var lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 360;
    lp.Q.value = 0.5;
    var g = gain(EPS);
    src.connect(lp); lp.connect(g); g.connect(master);
    src.start();
    ambience = { src: src, lp: lp, gain: g };
  }

  // --------------------------------------------------------------------------
  // Engine
  // --------------------------------------------------------------------------
  function doStartEngine(kind) {
    if (!ctx) doInit();
    if (!ctx) return;
    if (engine) doStopEngine();

    var def = ENGINES[kind] || ENGINES.speedboat;
    var t = now();
    var sources = [], nodes = [];

    // Pre-shaper mix
    var mix = gain(0.7); nodes.push(mix);

    // Oscillator stack
    var oscs = [];
    for (var i = 0; i < def.oscs.length; i++) {
      var od = def.oscs[i];
      var o = ctx.createOscillator();
      o.type = od.type;
      o.frequency.value = def.base * od.ratio;
      o.detune.value = od.detune;
      var og = gain(od.gain);
      o.connect(og); og.connect(mix);
      o.start(t);
      sources.push(o); nodes.push(og);
      oscs.push({ osc: o, ratio: od.ratio });
    }

    // Sub oscillator (sine an octave down) for the throaty kinds
    var sub = null;
    if (def.sub) {
      sub = ctx.createOscillator();
      sub.type = 'sine';
      sub.frequency.value = def.base * def.sub.ratio;
      var sg = gain(def.sub.gain);
      sub.connect(sg); sg.connect(mix);
      sub.start(t);
      sources.push(sub); nodes.push(sg);
    }

    // Exhaust / mechanical hiss: filtered noise fed into the same drive chain
    var exSrc = noiseSource('white');
    var exBp = ctx.createBiquadFilter();
    exBp.type = 'bandpass';
    exBp.frequency.value = def.noise.bp;
    exBp.Q.value = def.noise.q;
    var exGain = gain(def.noise.gain * 0.5);
    exSrc.connect(exBp); exBp.connect(exGain); exGain.connect(mix);
    exSrc.start(t);
    sources.push(exSrc); nodes.push(exBp, exGain);

    // Drive -> (formant) -> bandpass -> lowpass -> AM stage -> output
    var shaper = makeShaper(def.drive); nodes.push(shaper);

    var afterShaper = shaper;
    var formant = null;
    if (def.formant) {
      formant = ctx.createBiquadFilter();
      formant.type = 'peaking';
      formant.frequency.value = def.formant.freq;
      formant.Q.value = def.formant.q;
      formant.gain.value = def.formant.db;
      nodes.push(formant);
    }

    var bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = def.bpBase + def.bpRange * 0.15;
    bp.Q.value = def.bpQ;
    nodes.push(bp);

    var lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = def.lpBase * 0.5;
    lp.Q.value = 0.4;
    nodes.push(lp);

    // Amplitude modulation (burble / putt-putt / flutter)
    var amp = gain(1 - def.am.depth); nodes.push(amp);
    var lfo = ctx.createOscillator();
    lfo.type = 'sine';
    lfo.frequency.value = def.am.rate;
    var lfoGain = gain(def.am.depth);
    lfo.connect(lfoGain); lfoGain.connect(amp.gain);
    lfo.start(t);
    sources.push(lfo); nodes.push(lfoGain);

    // Output gain, faded in to avoid pops (engine bus is padded to 0.45)
    var out = gain(EPS); nodes.push(out);
    out.gain.setTargetAtTime(def.idle, t, 0.15);

    mix.connect(shaper);
    if (formant) { shaper.connect(formant); formant.connect(bp); }
    else { shaper.connect(bp); }
    bp.connect(lp); lp.connect(amp); amp.connect(out); out.connect(engineBus);

    // Water spray: bright filtered noise, driven by speed/turning in update()
    var spSrc = noiseSource('white');
    var spBp = ctx.createBiquadFilter();
    spBp.type = 'bandpass';
    spBp.frequency.value = 2600;
    spBp.Q.value = 0.5;
    var spGain = gain(EPS);
    spSrc.connect(spBp); spBp.connect(spGain); spGain.connect(engineBus);
    spSrc.start(t);
    sources.push(spSrc); nodes.push(spBp, spGain);

    engine = {
      def: def, kind: kind,
      oscs: oscs, sub: sub,
      exGain: exGain,
      bp: bp, lp: lp, formant: formant,
      amp: amp, lfo: lfo, lfoGain: lfoGain,
      out: out,
      sprayBp: spBp, sprayGain: spGain,
      sources: sources, nodes: nodes
    };
  }

  function doStopEngine() {
    var e = engine;
    engine = null;
    if (!e || !ctx) return;
    var t = now();
    e.out.gain.cancelScheduledValues(t);
    e.out.gain.setTargetAtTime(EPS, t, 0.06);
    e.sprayGain.gain.setTargetAtTime(EPS, t, 0.04);
    setTimeout(function () {
      var i;
      for (i = 0; i < e.sources.length; i++) {
        try { e.sources[i].stop(); } catch (err) { /* ignore */ }
        try { e.sources[i].disconnect(); } catch (err) { /* ignore */ }
      }
      for (i = 0; i < e.nodes.length; i++) {
        try { e.nodes[i].disconnect(); } catch (err) { /* ignore */ }
      }
    }, 350);
  }

  // --------------------------------------------------------------------------
  // Per-frame update
  // --------------------------------------------------------------------------
  function doUpdate(dt, s) {
    if (!ctx || !s) return;

    var rpm = clamp01(s.rpm);
    var throttle = clamp01(s.throttle);
    var turning = clamp01(s.turning);
    var speedNorm = clamp01((+s.speed || 0) / 28); // ~28 m/s ≈ full tilt
    var airborne = !!s.airborne;
    var inLake = !!s.inLake;

    // Ambience swells with speed and out on the open lake
    if (ambience) {
      var ambTarget = 0.010 + 0.030 * speedNorm + (inLake ? 0.035 : 0);
      setT(ambience.gain.gain, ambTarget, TAU_SLOW);
      setT(ambience.lp.frequency, 320 + 380 * speedNorm + (inLake ? 160 : 0), TAU_SLOW);
    }

    var e = engine;
    if (!e) return;
    var def = e.def;

    // rpm -> pitch across ~1 octave; airborne prop flares pitch up ~15%
    var pitch = def.base * (1 + rpm) * (airborne ? 1.15 : 1);
    var i;
    for (i = 0; i < e.oscs.length; i++) {
      setT(e.oscs[i].osc.frequency, pitch * e.oscs[i].ratio, TAU_FAST);
    }
    if (e.sub) setT(e.sub.frequency, pitch * def.sub.ratio, TAU_FAST);

    // throttle -> loudness; rpm/throttle -> brightness (filter movement)
    var load = 0.72 * throttle + 0.28 * rpm;
    setT(e.out.gain, def.idle + (def.full - def.idle) * load, TAU_MED);
    setT(e.bp.frequency, def.bpBase + def.bpRange * Math.pow(rpm, 1.4), TAU_MED);
    setT(e.lp.frequency, def.lpBase * (0.35 + 0.40 * throttle + 0.25 * rpm), TAU_MED);
    setT(e.exGain.gain, def.noise.gain * (0.35 + 0.65 * throttle), TAU_MED);

    // Amplitude modulation character follows rpm (putter speeds up + smooths out)
    var amRate = def.am.rate + def.am.rateRpm * rpm;
    var amDepth = clamp(def.am.depth + def.am.depthRpm * rpm, 0, 0.9);
    setT(e.lfo.frequency, amRate, TAU_MED);
    setT(e.lfoGain.gain, amDepth, TAU_MED);
    setT(e.amp.gain, 1 - amDepth, TAU_MED);

    // Water spray: grows with speed and carving; cuts out entirely in the air
    var spray = airborne ? EPS : 0.16 * speedNorm * (0.5 + 0.5 * turning);
    setT(e.sprayGain.gain, Math.max(spray, EPS), airborne ? 0.03 : 0.12);
    setT(e.sprayBp.frequency, 2000 + 2600 * speedNorm, 0.2);
  }

  // --------------------------------------------------------------------------
  // One-shots
  // --------------------------------------------------------------------------
  function ready() {
    if (!ctx) doInit();
    return !!ctx;
  }

  function doCountdownBeep(final_) {
    if (!ready()) return;
    var t = now();
    var f = final_ ? 1318.5 : 880;
    var dur = final_ ? 0.5 : 0.14;
    var o1 = ctx.createOscillator(); o1.type = 'sine'; o1.frequency.value = f;
    var o2 = ctx.createOscillator(); o2.type = 'triangle';
    o2.frequency.value = f; o2.detune.value = 6;
    var g = gain(0);
    var lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 4200;
    o1.connect(g); o2.connect(g); g.connect(lp); lp.connect(fxBus);
    env(g, t, 0.006, final_ ? 0.30 : 0.24, dur);
    o1.start(t); o2.start(t);
    o1.stop(t + dur + 0.05); o2.stop(t + dur + 0.05);
    cleanupOnEnd(o1, [o1, o2, g, lp]);
  }

  function doAirhorn() {
    if (!ready()) return;
    var t = now();
    var dur = 0.8;
    var freqs = [440, 587.33];
    var mix = gain(0.55);
    var ws = makeShaper(2.5);
    var lp = ctx.createBiquadFilter(); lp.type = 'lowpass';
    lp.frequency.value = 2400; lp.Q.value = 0.7;
    var out = gain(0);
    mix.connect(ws); ws.connect(lp); lp.connect(out); out.connect(fxBus);

    var nodes = [mix, ws, lp, out], anchor = null;
    for (var i = 0; i < freqs.length; i++) {
      for (var d = -6; d <= 6; d += 12) {
        var o = ctx.createOscillator();
        o.type = 'sawtooth';
        o.detune.value = d;
        // slight pitch scoop up on the attack, like pressure building
        o.frequency.setValueAtTime(freqs[i] * 0.94, t);
        o.frequency.linearRampToValueAtTime(freqs[i], t + 0.06);
        var og = gain(0.35);
        o.connect(og); og.connect(mix);
        o.start(t); o.stop(t + dur + 0.05);
        nodes.push(o, og);
        anchor = o;
      }
    }
    out.gain.setValueAtTime(EPS, t);
    out.gain.linearRampToValueAtTime(0.5, t + 0.025);
    out.gain.setValueAtTime(0.5, t + dur - 0.18);
    out.gain.exponentialRampToValueAtTime(EPS, t + dur);
    if (anchor) cleanupOnEnd(anchor, nodes);
  }

  function chimeNote(t, f, peak, dur) {
    var o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f;
    var h = ctx.createOscillator(); h.type = 'sine'; h.frequency.value = f * 2;
    var g = gain(0), hg = gain(0.18);
    o.connect(g); h.connect(hg); hg.connect(g); g.connect(fxBus);
    env(g, t, 0.008, peak, dur);
    o.start(t); h.start(t);
    o.stop(t + dur + 0.05); h.stop(t + dur + 0.05);
    cleanupOnEnd(o, [o, h, g, hg]);
  }

  function doCheckpoint() {
    if (!ready()) return;
    var t = now();
    chimeNote(t, 987.77, 0.22, 0.20);         // B5
    chimeNote(t + 0.09, 1318.51, 0.22, 0.30);  // E6
  }

  function doSplash(intensity) {
    if (!ready()) return;
    var t = now();
    var k = clamp01(intensity === undefined ? 0.7 : intensity);
    var dur = 0.28 + 0.40 * k;
    var src = ctx.createBufferSource();
    src.buffer = noiseBuffer('white');
    var lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 0.6;
    lp.frequency.setValueAtTime(2200 + 3000 * k, t);
    lp.frequency.exponentialRampToValueAtTime(320, t + dur);
    var g = gain(0);
    src.connect(lp); lp.connect(g); g.connect(fxBus);
    env(g, t, 0.012, 0.10 + 0.30 * k, dur);
    src.start(t); src.stop(t + dur + 0.05);
    cleanupOnEnd(src, [src, lp, g]);
  }

  function doThud(intensity) {
    if (!ready()) return;
    var t = now();
    var k = clamp01(intensity === undefined ? 0.7 : intensity);
    // Low sine knock with a fast downward pitch bend
    var o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(105 + 40 * k, t);
    o.frequency.exponentialRampToValueAtTime(44, t + 0.13);
    var og = gain(0);
    o.connect(og); og.connect(fxBus);
    env(og, t, 0.004, 0.16 + 0.34 * k, 0.24);
    o.start(t); o.stop(t + 0.3);
    cleanupOnEnd(o, [o, og]);
    // Splintery noise transient
    var n = ctx.createBufferSource(); n.buffer = noiseBuffer('white');
    var nlp = ctx.createBiquadFilter(); nlp.type = 'lowpass'; nlp.frequency.value = 900;
    var ng = gain(0);
    n.connect(nlp); nlp.connect(ng); ng.connect(fxBus);
    env(ng, t, 0.003, 0.06 + 0.14 * k, 0.09);
    n.start(t); n.stop(t + 0.12);
    cleanupOnEnd(n, [n, nlp, ng]);
  }

  function doUiMove() {
    if (!ready()) return;
    chimeNote(now(), 620, 0.10, 0.06);
  }

  function doUiSelect() {
    if (!ready()) return;
    var t = now();
    chimeNote(t, 660, 0.13, 0.08);
    chimeNote(t + 0.07, 990, 0.13, 0.12);
  }

  function fanfareNote(t, f, dur, peak) {
    var mix = gain(0);
    var lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600;
    mix.connect(lp); lp.connect(fxBus);
    var nodes = [mix, lp], anchor = null;
    var parts = [
      { type: 'triangle', detune: -5, g: 0.5 },
      { type: 'triangle', detune: 5, g: 0.5 },
      { type: 'sawtooth', detune: 0, g: 0.12 }
    ];
    for (var i = 0; i < parts.length; i++) {
      var o = ctx.createOscillator();
      o.type = parts[i].type; o.frequency.value = f; o.detune.value = parts[i].detune;
      var og = gain(parts[i].g);
      o.connect(og); og.connect(mix);
      o.start(t); o.stop(t + dur + 0.05);
      nodes.push(o, og);
      anchor = o;
    }
    env(mix, t, 0.012, peak, dur);
    if (anchor) cleanupOnEnd(anchor, nodes);
  }

  function doFinishFanfare(won) {
    if (!ready()) return;
    var t = now();
    var notes, chord;
    if (won) {
      notes = [523.25, 659.26, 783.99, 1046.5];   // C5 E5 G5 C6 — major
      chord = [523.25, 659.26, 783.99];           // C major
    } else {
      notes = [659.26, 622.25, 523.25, 440.0];    // E5 Eb5 C5 A4 — minor slump
      chord = [440.0, 523.25, 659.26];            // A minor
    }
    var times = [0, 0.15, 0.30, 0.50];
    for (var i = 0; i < 4; i++) {
      fanfareNote(t + times[i], notes[i], i === 3 ? 0.85 : 0.22, i === 3 ? 0.22 : 0.18);
    }
    for (var c = 0; c < chord.length; c++) {
      fanfareNote(t + times[3], chord[c] * 0.5, 0.9, 0.06);
    }
  }

  function gullChirp(t, f0, f1, dur, dest) {
    var o = ctx.createOscillator(); o.type = 'triangle';
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    // Vibrato — the warble that makes it read as a gull
    var v = ctx.createOscillator(); v.type = 'sine'; v.frequency.value = 34;
    var vg = gain(70);
    v.connect(vg); vg.connect(o.frequency);
    var bp = ctx.createBiquadFilter(); bp.type = 'bandpass';
    bp.frequency.value = (f0 + f1) * 0.5; bp.Q.value = 1.2;
    var g = gain(0);
    o.connect(bp); bp.connect(g); g.connect(dest);
    env(g, t, 0.02, 0.10, dur);
    o.start(t); v.start(t);
    o.stop(t + dur + 0.05); v.stop(t + dur + 0.05);
    cleanupOnEnd(o, [o, v, vg, bp, g]);
  }

  function doSeagull() {
    if (!ready()) return;
    var t = now();
    var pan = panNode(Math.random() * 1.4 - 0.7);
    pan.connect(fxBus);
    var jitter = 0.92 + Math.random() * 0.16;
    gullChirp(t, 1700 * jitter, 1080 * jitter, 0.26, pan);
    gullChirp(t + 0.30, 1480 * jitter, 940 * jitter, 0.30, pan);
    setTimeout(function () {
      try { pan.disconnect(); } catch (e) { /* ignore */ }
    }, 1200);
  }

  // --------------------------------------------------------------------------
  // Music — one lookahead scheduler, two ORIGINAL loops (never both):
  //  'title' — warm Chicago-house groove, 112 BPM, F-major soul changes
  //            (I–vi–IV–V voiced as maj9/m9/9), gospel piano stabs, walking
  //            sub bass, soft four-on-floor kick, offbeat hats, airy swells.
  //  'race'  — driving hype loop, 126 BPM, A minor, hard kick + 808 sub
  //            bassline, sparse dark brass stabs, energetic hats.
  // All material composed for this game; no existing song is quoted.
  // --------------------------------------------------------------------------
  var TITLE_BPM = 112, RACE_BPM = 126;

  // Title: chord voicings (Hz) and per-bar walking bass (quarter notes)
  var T_CH = {
    F:  [174.61, 220.00, 261.63, 329.63, 392.00], // Fmaj9  (F A C E G)
    Dm: [174.61, 220.00, 261.63, 329.63],         // Dm9 rootless (F A C E)
    Bb: [233.08, 293.66, 349.23, 440.00],         // Bbmaj9 (Bb D F A)
    C9: [261.63, 329.63, 392.00, 466.16]          // C9    (C E G Bb)
  };
  var TITLE_BARS = [
    { chord: T_CH.F,  walk: [87.31, 110.00, 130.81, 110.00] }, // F2 A2 C3 A2
    { chord: T_CH.F,  walk: [87.31,  98.00,  82.41,  73.42] }, // walk down to Dm
    { chord: T_CH.Dm, walk: [73.42,  87.31, 110.00,  87.31] }, // D2 F2 A2 F2
    { chord: T_CH.Dm, walk: [73.42,  65.41,  61.74,  58.27] }, // chromatic to Bb
    { chord: T_CH.Bb, walk: [58.27,  73.42,  87.31,  73.42] }, // Bb1 D2 F2 D2
    { chord: T_CH.Bb, walk: [58.27,  61.74,  65.41,  61.74] }, // creep up to C
    { chord: T_CH.C9, walk: [65.41,  82.41,  98.00,  82.41] }, // C2 E2 G2 E2
    { chord: T_CH.C9, walk: [65.41,  98.00,  87.31,  82.41] }  // turn back home
  ];
  var T_STAB_A = [2, 6, 10, 14]; // straight offbeat 8ths
  var T_STAB_B = [2, 6, 10, 13]; // syncopated; 13 anticipates the next chord

  // Race: minor stab voicings, 808 roots, sparse stab placements
  var R_CH = {
    Am: [220.00, 261.63, 329.63], // A3 C4 E4
    F:  [174.61, 220.00, 261.63], // F3 A3 C4
    G:  [196.00, 246.94, 293.66], // G3 B3 D4
    E:  [164.81, 207.65, 246.94]  // E3 G#3 B3 — V turnaround tension
  };
  var RACE_BARS = [
    { root: 55.00, chord: R_CH.Am, stabs: [4] },
    { root: 55.00, chord: R_CH.Am, stabs: [] },
    { root: 55.00, chord: R_CH.Am, stabs: [4, 11] },
    { root: 55.00, chord: R_CH.Am, stabs: [] },
    { root: 43.65, chord: R_CH.F,  stabs: [4] },
    { root: 43.65, chord: R_CH.F,  stabs: [11] },
    { root: 49.00, chord: R_CH.G,  stabs: [4] },
    { root: 41.20, chord: R_CH.E,  stabs: [8, 10, 12] } // turnaround fill
  ];
  var R_808 = [0, 3, 6, 8, 11, 14]; // syncopated sub pattern (6/14 jump octave)

  function trackSource(src) {
    music.sources.push(src);
    src.onended = function () {
      var idx = music.sources.indexOf(src);
      if (idx >= 0) music.sources.splice(idx, 1);
      src.onended = null;
    };
  }

  function killSources(list) {
    for (var i = 0; i < list.length; i++) {
      try { list[i].onended = null; list[i].stop(); } catch (e) { /* ignore */ }
      try { list[i].disconnect(); } catch (e) { /* ignore */ }
    }
  }

  function ensureMusicBuses() {
    if (music.bus) return;
    music.bus = gain(EPS);
    music.bus.connect(master);

    music.padFilter = ctx.createBiquadFilter();
    music.padFilter.type = 'lowpass';
    music.padFilter.frequency.value = 2200;
    music.padFilter.Q.value = 0.4;
    music.padGain = gain(0.55);
    music.padFilter.connect(music.padGain);
    music.padGain.connect(music.bus);

    music.bassFilter = ctx.createBiquadFilter();
    music.bassFilter.type = 'lowpass';
    music.bassFilter.frequency.value = 700;
    music.bassGain = gain(0.8);
    music.bassFilter.connect(music.bassGain);
    music.bassGain.connect(music.bus);

    music.hatFilter = ctx.createBiquadFilter();
    music.hatFilter.type = 'highpass';
    music.hatFilter.frequency.value = 7800;
    music.hatGain = gain(0.5);
    music.hatFilter.connect(music.hatGain);
    music.hatGain.connect(music.bus);

    music.kickGain = gain(0.8);
    music.kickGain.connect(music.bus);
  }

  // Per-mode tempo / mix / tone. Called with the bus near-silent.
  function applyMode(mode) {
    if (mode === 'race') {
      music.stepDur = 60 / RACE_BPM / 4;
      music.level = 0.34;                      // clearly over the quiet engines, under SFX peaks
      music.padFilter.frequency.value = 1000;  // darker stabs
      music.padGain.gain.value = 0.6;
      music.bassFilter.frequency.value = 380;  // pure 808 sub
      music.bassGain.gain.value = 0.9;
      music.hatGain.gain.value = 0.65;
      music.kickGain.gain.value = 1.0;
    } else {
      music.stepDur = 60 / TITLE_BPM / 4;
      music.level = 0.30;
      music.padFilter.frequency.value = 2200;  // warm piano brightness
      music.padGain.gain.value = 0.55;
      music.bassFilter.frequency.value = 700;
      music.bassGain.gain.value = 0.8;
      music.hatGain.gain.value = 0.5;
      music.kickGain.gain.value = 0.8;
    }
    music.stepsTotal = 128; // both loops: 8 bars of 16 steps
  }

  // Airy pad swell: slow-attack detuned triangles through the pad lowpass
  function swellPad(freqs, t, dur, lvl) {
    for (var i = 0; i < freqs.length; i++) {
      for (var d = -5; d <= 5; d += 10) {
        var o = ctx.createOscillator();
        o.type = 'triangle';
        o.frequency.value = freqs[i];
        o.detune.value = d;
        var g = gain(0);
        o.connect(g); g.connect(music.padFilter);
        g.gain.setValueAtTime(EPS, t);
        g.gain.linearRampToValueAtTime(lvl, t + dur * 0.45);
        g.gain.linearRampToValueAtTime(EPS, t + dur);
        o.start(t); o.stop(t + dur + 0.1);
        trackSource(o);
        cleanupOnEnd(o, [o, g]);
      }
    }
  }

  // Chord stab: detuned saw/triangle stack, fast attack, exp decay.
  // brass=false → gospel piano flavor; brass=true → dark race brass.
  function stabChord(freqs, t, dur, lvl, brass) {
    for (var i = 0; i < freqs.length; i++) {
      var o1 = ctx.createOscillator();
      o1.type = 'sawtooth';
      o1.frequency.value = freqs[i];
      o1.detune.value = brass ? -9 : -6;
      var o2 = ctx.createOscillator();
      o2.type = brass ? 'sawtooth' : 'triangle';
      o2.frequency.value = freqs[i];
      o2.detune.value = brass ? 9 : 5;
      var g1 = gain(brass ? 0.5 : 0.30), g2 = gain(brass ? 0.5 : 0.75);
      var g = gain(0);
      o1.connect(g1); o2.connect(g2); g1.connect(g); g2.connect(g);
      g.connect(music.padFilter);
      g.gain.setValueAtTime(EPS, t);
      g.gain.linearRampToValueAtTime(lvl, t + 0.005);
      g.gain.exponentialRampToValueAtTime(EPS, t + dur);
      o1.start(t); o2.start(t);
      o1.stop(t + dur + 0.05); o2.stop(t + dur + 0.05);
      trackSource(o1);
      cleanupOnEnd(o1, [o1, o2, g1, g2, g]);
    }
  }

  // Round walking bass (title): triangle + sine an octave blend
  function bassNote(f, t, dur, lvl) {
    var o1 = ctx.createOscillator(); o1.type = 'triangle'; o1.frequency.value = f;
    var o2 = ctx.createOscillator(); o2.type = 'sine'; o2.frequency.value = f;
    var g = gain(0);
    var g2 = gain(0.6);
    o1.connect(g); o2.connect(g2); g2.connect(g);
    g.connect(music.bassFilter);
    g.gain.setValueAtTime(EPS, t);
    g.gain.linearRampToValueAtTime(lvl, t + 0.03);
    g.gain.setValueAtTime(lvl * 0.8, t + dur * 0.6);
    g.gain.linearRampToValueAtTime(EPS, t + dur);
    o1.start(t); o2.start(t);
    o1.stop(t + dur + 0.05); o2.stop(t + dur + 0.05);
    trackSource(o1);
    cleanupOnEnd(o1, [o1, o2, g, g2]);
  }

  // 808-style sub (race): sine with a quick pitch drop and long-ish decay
  function bass808(f, t, dur, lvl) {
    var o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(f * 2.2, t);
    o.frequency.exponentialRampToValueAtTime(f, t + 0.04);
    var g = gain(0);
    o.connect(g); g.connect(music.bassFilter);
    g.gain.setValueAtTime(EPS, t);
    g.gain.linearRampToValueAtTime(lvl, t + 0.006);
    g.gain.exponentialRampToValueAtTime(EPS, t + dur);
    o.start(t); o.stop(t + dur + 0.05);
    trackSource(o);
    cleanupOnEnd(o, [o, g]);
  }

  // Four-on-the-floor kick: sine drop. hard=true for the race loop.
  function kick(t, hard) {
    var o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(hard ? 165 : 120, t);
    o.frequency.exponentialRampToValueAtTime(hard ? 50 : 44, t + 0.085);
    var g = gain(0);
    o.connect(g); g.connect(music.kickGain);
    g.gain.setValueAtTime(EPS, t);
    g.gain.linearRampToValueAtTime(hard ? 0.85 : 0.5, t + 0.004);
    g.gain.exponentialRampToValueAtTime(EPS, t + (hard ? 0.24 : 0.18));
    o.start(t); o.stop(t + 0.3);
    trackSource(o);
    cleanupOnEnd(o, [o, g]);
  }

  function hatTick(t, accent, dec) {
    var src = ctx.createBufferSource();
    src.buffer = noiseBuffer('white');
    src.playbackRate.value = 1.4;
    var g = gain(0);
    src.connect(g); g.connect(music.hatFilter);
    var peak = accent ? 0.055 : 0.025;
    var d = dec || 0.055;
    g.gain.setValueAtTime(EPS, t);
    g.gain.linearRampToValueAtTime(peak, t + 0.004);
    g.gain.exponentialRampToValueAtTime(EPS, t + d);
    src.start(t); src.stop(t + d + 0.03);
    trackSource(src);
    cleanupOnEnd(src, [src, g]);
  }

  function scheduleTitleStep(step, t) {
    var bar = (step / 16) | 0, s = step % 16;
    var B = TITLE_BARS[bar];
    // Soft four-on-the-floor + walking bass quarters
    if (s % 4 === 0) {
      kick(t, false);
      bassNote(B.walk[s / 4], t, music.stepDur * 3.4, 0.24);
    }
    // Gospel piano stabs on the offbeats; odd bars anticipate the next chord
    var pat = (bar % 2) ? T_STAB_B : T_STAB_A;
    if (pat.indexOf(s) >= 0) {
      var ch = (s === 13) ? TITLE_BARS[(bar + 1) % 8].chord : B.chord;
      stabChord(ch, t, 0.24, 0.11, false);
    }
    // Airy swell twice per loop (bars 0 and 4), a bar and a half long
    if (s === 0 && (bar === 0 || bar === 4)) {
      swellPad(B.chord, t, 24 * music.stepDur, 0.035);
    }
    // Offbeat-accented hats on 8ths
    if (s % 2 === 0) hatTick(t, s % 4 === 2, s % 4 === 2 ? 0.09 : 0.05);
  }

  function scheduleRaceStep(step, t) {
    var bar = (step / 16) | 0, s = step % 16;
    var B = RACE_BARS[bar];
    // Hard four-on-the-floor
    if (s % 4 === 0) kick(t, true);
    // Syncopated 808 subs; steps 6/14 jump the octave
    if (R_808.indexOf(s) >= 0) {
      var f = (s === 6 || s === 14) ? B.root * 2 : B.root;
      bass808(f, t, 0.32, s % 8 === 0 ? 0.55 : 0.42);
    }
    // Sparse dark brass stabs
    if (B.stabs.indexOf(s) >= 0) stabChord(B.chord, t, 0.16, 0.14, true);
    // Energetic hats: offbeat 8ths accented, 16th fills on bars 3 and 7
    if (s % 2 === 0) hatTick(t, s % 4 === 2, s % 4 === 2 ? 0.11 : 0.05);
    else if ((bar === 3 || bar === 7) && s >= 11) hatTick(t, false, 0.04);
  }

  function scheduleStep(step, t) {
    if (music.mode === 'race') scheduleRaceStep(step, t);
    else scheduleTitleStep(step, t);
  }

  function schedulerTick() {
    if (!ctx || !music.playing) return;
    var ahead = ctx.currentTime + 0.2; // schedule 200ms ahead
    while (music.nextTime < ahead) {
      scheduleStep(music.step, music.nextTime);
      music.nextTime += music.stepDur;
      music.step = (music.step + 1) % music.stepsTotal;
    }
  }

  // Shared start/stop for both loops. Idempotent; switching stops the other.
  function doSetMode(mode, on) {
    if (!on) {
      if (music.wantMode === mode) music.wantMode = null;
      if (!music.playing || music.mode !== mode) return; // off is a no-op unless this loop plays
      music.playing = false;
      if (music.interval) { clearInterval(music.interval); music.interval = null; }
      if (!ctx || !music.bus) { music.sources.length = 0; return; }
      var t2 = now();
      music.bus.gain.cancelScheduledValues(t2);
      music.bus.gain.setValueAtTime(Math.max(music.bus.gain.value, EPS), t2);
      music.bus.gain.linearRampToValueAtTime(EPS, t2 + 0.8); // fade out
      setTimeout(function () {
        if (music.playing) return; // restarted during the fade
        var list = music.sources.slice();
        music.sources.length = 0;
        killSources(list);
      }, 900);
      return;
    }
    if (!ready()) { music.wantMode = mode; return; }   // remember: init will start us
    ensureMusicBuses();
    if (music.playing && music.mode === mode) return; // idempotent
    var t = now(), startAt = t + 0.06;
    music.bus.gain.cancelScheduledValues(t);
    music.bus.gain.setValueAtTime(Math.max(music.bus.gain.value, EPS), t);
    if (music.playing) {
      // Hot-switch: duck the bus, retire the other loop's scheduled notes
      if (music.interval) { clearInterval(music.interval); music.interval = null; }
      music.playing = false;
      music.bus.gain.linearRampToValueAtTime(EPS, t + 0.08);
      music.bus.gain.setValueAtTime(EPS, t + 0.09);
      var old = music.sources.slice();
      music.sources.length = 0;
      setTimeout(function () { killSources(old); }, 130);
      startAt = t + 0.14;
    }
    music.mode = mode;
    applyMode(mode);
    music.playing = true;
    music.step = 0;
    music.nextTime = startAt;
    music.bus.gain.linearRampToValueAtTime(music.level, startAt + 0.7); // fade in
    schedulerTick();
    music.interval = setInterval(schedulerTick, 100);
  }

  function doSetMusic(on) { doSetMode('title', !!on); }
  function doSetRaceMusic(on) { doSetMode('race', !!on); }

  // --------------------------------------------------------------------------
  // Public API — every method wrapped so it can never throw
  // --------------------------------------------------------------------------
  function safe(fn) {
    return function () {
      try { return fn.apply(null, arguments); } catch (e) { /* never throw */ }
    };
  }

  RR.Audio = {
    init: safe(doInit),
    resume: safe(doResume),
    setMaster: safe(function (v) {
      masterLevel = clamp01(v);
      if (ctx && master) setT(master.gain, masterLevel, TAU_FAST);
    }),
    startEngine: safe(doStartEngine),
    stopEngine: safe(doStopEngine),
    update: safe(doUpdate),
    countdownBeep: safe(doCountdownBeep),
    airhorn: safe(doAirhorn),
    checkpoint: safe(doCheckpoint),
    splash: safe(doSplash),
    thud: safe(doThud),
    uiMove: safe(doUiMove),
    uiSelect: safe(doUiSelect),
    finishFanfare: safe(doFinishFanfare),
    seagull: safe(doSeagull),
    setMusic: safe(doSetMusic),
    setRaceMusic: safe(doSetRaceMusic)
  };
})();

</script>
<script>
/* ===== js/game/race.js ===== */
/* River Racer — courses, checkpoints, standings, race state machine */
(function () {
  const RACE = {};
  const U = () => RR.U;

  // course definitions reference named channel paths; routes are stitched at load
  RACE.COURSES = [
    {
      id: 'mainstem', name: 'MAIN STEM SPRINT', laps: 1,
      desc: 'Wolf Point to Navy Pier. Ten bridges, one lock, full throttle through the glass canyon.',
      segments: [{ path: 'main' }, { path: 'lakeGuide', toFrac: 0.62 }],
    },
    {
      id: 'riverrun', name: 'FULL RIVER RUN', laps: 1,
      desc: 'From the North Branch narrows at Goose Island all the way out past the lighthouse. The grand tour.',
      segments: [{ path: 'north' }, { path: 'main' }, { path: 'lakeGuide' }],
    },
    {
      id: 'southbranch', name: 'SOUTH BRANCH CHARGE', laps: 1,
      desc: 'Launch under the shadow of Willis Tower, thread the Loop bridges, sprint the Main Stem to the lock.',
      segments: [{ path: 'south' }, { path: 'main' }],
    },
    {
      id: 'lakecircuit', name: 'LAKE MICHIGAN CIRCUIT', laps: 2,
      desc: 'Two laps of open-water chop around the harbor lighthouse, skimming Navy Pier. Big waves, big air.',
      segments: [{ path: 'lakeLoop' }], loop: true,
    },
  ];

  // stitch dense path slices into one route
  function buildRoute(course) {
    const xs = [], zs = [], ws = [];
    for (const seg of course.segments) {
      const p = RR.River.paths[seg.path];
      if (!p) { console.error('missing path', seg.path); continue; }
      const i0 = Math.floor((seg.fromFrac || 0) * (p.n - 1));
      const i1 = Math.ceil((seg.toFrac == null ? 1 : seg.toFrac) * (p.n - 1));
      for (let i = i0; i <= i1; i++) {
        const n = xs.length;
        if (n && U().dist2(xs[n - 1], zs[n - 1], p.x[i], p.z[i]) < 25) continue;  // dedupe stitch joints
        xs.push(p.x[i]); zs.push(p.z[i]); ws.push(p.w[i]);
      }
    }
    const n = xs.length;
    const route = { x: new Float32Array(xs), z: new Float32Array(zs), w: new Float32Array(ws), cum: new Float32Array(n), n, loop: !!course.loop };
    let len = 0;
    for (let i = 1; i < n; i++) { len += Math.hypot(xs[i] - xs[i - 1], zs[i] - zs[i - 1]); route.cum[i] = len; }
    route.len = len;
    return route;
  }

  // ---------- gate + buoy visuals ----------
  let gateGroup;
  function buoyMesh(color) {
    const c = new THREE.Color(color).convertSRGBToLinear();
    const g = new THREE.Group();
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.75, 1.5, 8),
      new THREE.MeshStandardMaterial({ color: c, roughness: 0.5 }));
    body.position.y = 0.75; g.add(body);
    const top = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 1.1, 6),
      new THREE.MeshStandardMaterial({ color: 0x222831, roughness: 0.6 }));
    top.position.y = 1.9; g.add(top);
    const beacon = new THREE.Mesh(new THREE.SphereGeometry(0.2, 8, 6),
      new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: c, emissiveIntensity: 1.6 }));
    beacon.position.y = 2.5; g.add(beacon);
    return g;
  }

  // scrolling gold chevrons painted on the water + tall lit pylons, ONLY on the open-lake legs,
  // so the course is unmistakable once it leaves the framed river canyon
  function chevronTex() {
    return RR.U.canvasTexture(64, 128, (c, w, h) => {
      c.clearRect(0, 0, w, h);
      c.strokeStyle = '#ffd24a'; c.lineWidth = 14; c.lineCap = 'round';
      // apex toward -canvas-y = +v = toward the FINISH (CanvasTexture flips Y)
      for (let k = 0; k < 4; k++) {
        const y = k * (h / 2);
        c.beginPath(); c.moveTo(6, y); c.lineTo(w / 2, y - h * 0.28); c.lineTo(w - 6, y); c.stroke();
      }
    });
  }
  function buildLakeMarkers(state) {
    const route = state.route, pt = {};
    const step = 12, halfW = 9;
    const verts = [], uvs = []; let vlen = 0, prev = null;
    for (let d = 0; d <= route.len; d += step) {
      U().pathAt(route, route.loop ? d % route.len : d, pt);
      if (!RR.River.inLake(pt.x, pt.z)) { prev = null; continue; }   // never lay the ribbon over the river channel
      const w = Math.min(halfW, pt.w - 4);
      const lx = pt.x - pt.tz * w, lz = pt.z + pt.tx * w;
      const rx = pt.x + pt.tz * w, rz = pt.z - pt.tx * w;
      if (prev) {
        vlen += Math.hypot(pt.x - prev.x, pt.z - prev.z);
        verts.push(prev.lx, 0.35, prev.lz, prev.rx, 0.35, prev.rz, lx, 0.35, lz,
                   prev.rx, 0.35, prev.rz, rx, 0.35, rz, lx, 0.35, lz);
        const v0 = prev.v, v1 = vlen / 24;
        uvs.push(0, v0, 1, v0, 0, v1, 1, v0, 1, v1, 0, v1);
      }
      prev = { lx, lz, rx, rz, x: pt.x, z: pt.z, v: vlen / 24 };
    }
    if (verts.length) {
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      const tex = chevronTex(); tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      const ribbon = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
        map: tex, transparent: true, opacity: 0.9, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide }));
      ribbon.renderOrder = 2; ribbon.layers.set(1);
      gateGroup.add(ribbon);
      state.lakeRibbon = { tex };
    }
    for (const cp of state.checkpoints) {
      if (!RR.River.inLake(cp.x, cp.z)) continue;
      const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.5, 22, 8),
        new THREE.MeshStandardMaterial({ color: 0x1b2733, emissive: 0xffc857, emissiveIntensity: 0.6, roughness: 0.5 }));
      mast.position.set(cp.x, 11, cp.z);
      const glow = new THREE.Mesh(new THREE.SphereGeometry(1.1, 10, 8), new THREE.MeshBasicMaterial({ color: 0xffd24a }));
      glow.position.set(cp.x, 22, cp.z);
      gateGroup.add(mast, glow);
      cp.pylonGlow = glow;
    }
  }

  function buildGates(state) {
    gateGroup = new THREE.Group();
    RR.Engine.scene.add(gateGroup);
    const route = state.route;
    const spacing = U().clamp(route.len / 16, 160, 340);
    const count = Math.max(4, Math.floor(route.len / spacing) - (route.loop ? 0 : 1));
    state.checkpoints = [];
    const pt = {};
    for (let i = 1; i <= count; i++) {
      const d = i * (route.len / (count + (route.loop ? 0 : 1)));
      U().pathAt(route, d, pt);
      const off = Math.max(5, pt.w - 5);
      const L = buoyMesh(0xff3b30), R = buoyMesh(0x2ecc71);
      L.position.set(pt.x - pt.tz * off, 0, pt.z + pt.tx * off);
      R.position.set(pt.x + pt.tz * off, 0, pt.z - pt.tx * off);
      gateGroup.add(L, R);
      state.checkpoints.push({ d, x: pt.x, z: pt.z, L, R });
    }
    // ---- finish gate: a tall checkered arch with a FINISH banner, flags, and a water line ----
    const fd = route.loop ? route.len : route.len - 12;
    U().pathAt(route, Math.min(fd, route.len - 1), pt);
    const gOff = Math.max(9, pt.w + 3);
    const ang = Math.atan2(pt.tx, pt.tz);
    const checkerTex = RR.U.canvasTexture(128, 128, (ctx, w, h) => {
      const n = 8, cs = w / n;
      for (let x = 0; x < n; x++) for (let y = 0; y < n; y++) {
        ctx.fillStyle = (x + y) % 2 ? '#141414' : '#f5f5f5';
        ctx.fillRect(x * cs, y * cs, cs, cs);
      }
    });
    checkerTex.wrapS = checkerTex.wrapT = THREE.RepeatWrapping;
    const finishTex = RR.U.canvasTexture(512, 128, (ctx, w, h) => {
      const cs = 32;
      for (let x = 0; x < w / cs; x++) for (let r = 0; r < 2; r++) {
        ctx.fillStyle = (x + r) % 2 ? '#141414' : '#f5f5f5';
        ctx.fillRect(x * cs, r === 0 ? 0 : h - cs, cs, cs);
      }
      ctx.fillStyle = '#0b1e2d'; ctx.fillRect(0, cs, w, h - 2 * cs);
      ctx.fillStyle = '#ffc857'; ctx.font = 'bold 60px Arial, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('FINISH', w / 2, h / 2 + 2);
    });
    const finishFlags = [];
    for (const s of [-1, 1]) {
      const px = pt.x + pt.tz * gOff * s, pz = pt.z - pt.tx * gOff * s;
      const poleTex = checkerTex.clone(); poleTex.repeat.set(1, 9); poleTex.needsUpdate = true;
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.8, 17, 10), new THREE.MeshBasicMaterial({ map: poleTex }));
      pole.position.set(px, 8.5, pz); gateGroup.add(pole);
      const flag = new THREE.Mesh(new THREE.PlaneGeometry(3.4, 2.2, 6, 1), new THREE.MeshBasicMaterial({ map: checkerTex, side: THREE.DoubleSide }));
      flag.position.set(px + pt.tx * 1.7, 17.5, pz + pt.tz * 1.7); flag.rotation.y = ang;
      gateGroup.add(flag); finishFlags.push(flag);
    }
    const beam = new THREE.Mesh(new THREE.BoxGeometry(gOff * 2, 3.0, 1.4), new THREE.MeshBasicMaterial({ map: finishTex }));
    beam.position.set(pt.x, 15, pt.z); beam.rotation.y = ang; gateGroup.add(beam);
    // checkered line painted across the water
    const stripGeo = new THREE.PlaneGeometry(gOff * 2, 7); stripGeo.rotateX(-Math.PI / 2);
    const stripTex = checkerTex.clone(); stripTex.repeat.set(gOff / 2, 2); stripTex.needsUpdate = true;
    const strip = new THREE.Mesh(stripGeo, new THREE.MeshBasicMaterial({ map: stripTex, transparent: true, opacity: 0.8, depthWrite: false }));
    strip.rotation.y = ang; strip.position.set(pt.x, 0.35, pt.z); strip.renderOrder = 2;
    gateGroup.add(strip);
    buildLakeMarkers(state);
    state.finishD = fd;
    state.finishGate = { x: pt.x, z: pt.z };
    state.finishFlags = finishFlags;
  }

  // ---------- race state ----------
  let S = null;
  RACE.state = () => S;

  RACE.start = function (courseIdx, boats, playerBoat) {
    if (gateGroup) { RR.Engine.scene.remove(gateGroup); gateGroup = null; }
    const course = RACE.COURSES[courseIdx];
    S = {
      course, courseIdx,
      route: buildRoute(course),
      boats, player: playerBoat,
      phase: 'countdown', countdownT: 3.6,
      time: 0,
      wrongWayT: 0,
      results: [],
      finishTimeout: 12,
    };
    buildGates(S);

    // grid placement: staggered rows just past the line (loop seams stay behind everyone)
    const pt = {};
    boats.forEach((b, i) => {
      const startD = 26 + Math.floor(i / 2) * 14;
      U().pathAt(S.route, startD, pt);
      const side = (i % 2 ? 1 : -1) * Math.min(8, pt.w * 0.4);
      b.pos.set(pt.x - pt.tz * side, 0.2, pt.z + pt.tx * side);
      b.heading = Math.atan2(pt.tx, pt.tz);
      b.vel.x = 0; b.vel.z = 0; b.angVel = 0;
      b.routeD = startD;
      b._inLap = startD;
      b.lap = 0; b.nextCp = 0; b.finished = false; b.finishTime = 0;
      b.routeHint = null;
      b.boostEnergy = 1;
      RR.Physics.applyVisual(b);
    });
    return S;
  };

  // track progress; returns true the frame the boat crosses a checkpoint
  function updateProgress(b, dt) {
    const route = S.route;
    let q = U().pathNearest(route, b.pos.x, b.pos.z, b.routeHint, b.routeHint != null ? 40 : 0);
    if (route.loop && (q.idx > route.n - 6 || q.idx < 4 || q.dist > 25)) {
      // hinted window can't see across the seam — retry unhinted near the join
      const q2 = U().pathNearest(route, b.pos.x, b.pos.z);
      if (q2.dist < q.dist - 0.01) q = q2;
    }
    b.routeHint = q.idx;
    let d = q.d;
    if (route.loop) {
      // compare raw in-lap distances — never routeD % len, which snaps to ~0 right at the seam
      const prev = b._inLap == null ? d : b._inLap;
      let delta = d - prev;
      if (delta < -route.len * 0.5) { b.lap++; delta += route.len; if (b.isPlayer && S.phase === 'racing') RACE.onLap && RACE.onLap(b.lap); }
      else if (delta > route.len * 0.5) { delta -= route.len; b.lap = Math.max(0, b.lap - 1); }
      b._inLap = d;
      b.routeD = b.lap * route.len + d;
      b._backT = delta < -0.5 ? (b._backT || 0) + dt : 0;
    } else {
      const delta = d - b.routeD;
      b._backT = delta < -0.5 && Math.hypot(b.vel.x, b.vel.z) > 4 ? (b._backT || 0) + dt : 0;
      b.routeD = d;
    }

    // checkpoints
    let hit = false;
    const cps = S.checkpoints;
    const inLapD = route.loop ? b.routeD % route.len : b.routeD;
    while (b.nextCp < cps.length && inLapD > cps[b.nextCp].d - 6 &&
           U().dist2(b.pos.x, b.pos.z, cps[b.nextCp].x, cps[b.nextCp].z) < 130 * 130) {
      b.nextCp++;
      hit = true;
    }
    if (route.loop && b.nextCp >= cps.length && inLapD < cps[0].d) b.nextCp = 0;
    return hit;
  }

  function checkFinish(b) {
    if (b.finished) return;
    const route = S.route;
    const target = route.loop ? S.course.laps * route.len : S.finishD;
    if (b.routeD >= target - 2 && (route.loop || b.nextCp >= S.checkpoints.length * 0.6)) {
      b.finished = true;
      b.finishTime = S.time;
      S.results.push({ boat: b, time: S.time });
      if (b === S.player) {
        S.phase = 'finished';
        S.finishTimeout = Math.min(S.finishTimeout, 3.0);   // the race is over when YOU cross the line (placement pop plays first)
        saveBest(S.course.id, S.time);
        if (RACE.onPlayerFinish) RACE.onPlayerFinish(S.results.length, S.time);
      }
    }
  }

  function saveBest(id, t) {
    try {
      const k = 'rr_best_' + id;
      const old = parseFloat(localStorage.getItem(k));
      if (!isFinite(old) || t < old) localStorage.setItem(k, String(t));
    } catch (e) { /* storage may be unavailable from file:// — fine */ }
  }
  RACE.best = function (id) {
    try { const v = parseFloat(localStorage.getItem('rr_best_' + id)); return isFinite(v) ? v : null; }
    catch (e) { return null; }
  };

  RACE.update = function (dt) {
    if (!S) return;
    if (S.phase === 'countdown') {
      const prev = Math.ceil(S.countdownT);
      S.countdownT -= dt;
      const now = Math.ceil(S.countdownT);
      if (now !== prev && now > 0 && RACE.onCount) RACE.onCount(now);
      if (S.countdownT <= 0) {
        S.phase = 'racing';
        if (RACE.onCount) RACE.onCount(0);
      }
      // hold boats on the line
      for (const b of S.boats) { b.vel.x *= 0.5; b.vel.z *= 0.5; }
      return;
    }
    S.time += dt;

    for (const b of S.boats) {
      const hitCp = updateProgress(b, dt);
      if (hitCp && b === S.player && RACE.onCheckpoint) RACE.onCheckpoint(b.nextCp, S.checkpoints.length);
      checkFinish(b);
    }

    // standings by absolute route progress
    const order = [...S.boats].sort((a, b) => {
      if (a.finished && b.finished) return a.finishTime - b.finishTime;
      if (a.finished) return -1;
      if (b.finished) return 1;
      return b.routeD - a.routeD;
    });
    order.forEach((b, i) => { b.racePos = i + 1; });

    // player wrong-way indicator
    S.wrongWay = (S.player._backT || 0) > 1.2;

    if (S.phase === 'finished') {
      S.finishTimeout -= dt;
      const allDone = S.boats.every((b) => b.finished);
      if ((allDone || S.finishTimeout <= 0) && RACE.onRaceOver) {
        // fill DNF entries by current position
        for (const b of S.boats) if (!b.finished) S.results.push({ boat: b, time: Infinity });
        const cb = RACE.onRaceOver; RACE.onRaceOver = null;
        cb(S.results);
      }
    }
  };

  // pulse the next gate's beacons so the player always knows where to aim
  RACE.animateGates = function (t) {
    if (!S) return;
    const cps = S.checkpoints;
    for (let i = 0; i < cps.length; i++) {
      const active = S.player && (S.player.nextCp === i);
      const s = active ? 1 + Math.sin(t * 6) * 0.35 : 1;
      cps[i].L.scale.setScalar(s);
      cps[i].R.scale.setScalar(s);
      const y = RR.U.waterHeight(cps[i].L.position.x, cps[i].L.position.z, t, RR.River.waveAmp(cps[i].L.position.x, cps[i].L.position.z));
      cps[i].L.position.y = y; cps[i].R.position.y = y;
      cps[i].L.rotation.x = Math.sin(t * 1.3 + i) * 0.08;
      cps[i].R.rotation.x = Math.sin(t * 1.5 + i * 2) * 0.08;
      if (cps[i].pylonGlow) cps[i].pylonGlow.scale.setScalar(1 + Math.sin(t * 6) * (active ? 0.5 : 0.15));
    }
    if (S.lakeRibbon) S.lakeRibbon.tex.offset.y = -(t * 0.4) % 1;   // chevrons scroll toward the finish
  };

  RACE.routeForAI = function () { return { path: S.route }; };

  RR.Race = RACE;
})();

</script>
<script>
/* ===== js/ui/hud.js ===== */
/* River Racer — in-race HUD DOM bindings */
(function () {
  const H = {};
  const $ = (id) => document.getElementById(id);
  let els = null;
  let cpFlashT = 0, tagT = 0, lastTagged = null;

  H.init = function () {
    els = {
      hud: $('hud'), speed: $('speed-num'), throttle: $('throttle-fill'),
      pos: $('pos-big'), posSuf: $('pos-suffix'), posTotal: $('pos-total'), lap: $('lap-line'),
      timer: $('timer-num'), cpFlash: $('checkpoint-flash'), wrong: $('wrongway'),
      count: $('countdown'), tag: $('landmark-tag'), vig: $('vignette'),
    };
  };

  H.show = function (on) { els.hud.classList.toggle('on', on); };

  H.countdown = function (n) {
    els.count.style.display = 'block';
    if (n > 0) {
      els.count.textContent = n;
      els.count.style.color = '#fff';
    } else {
      els.count.textContent = 'GO!';
      els.count.style.color = '#2ecc71';
      setTimeout(() => { els.count.style.display = 'none'; }, 900);
    }
  };

  H.checkpointFlash = function (n, total) {
    els.cpFlash.textContent = 'CHECKPOINT ' + n + ' / ' + total;
    els.cpFlash.style.opacity = 1;
    cpFlashT = 1.1;
  };

  H.flash = function (text) {
    els.cpFlash.textContent = text;
    els.cpFlash.style.opacity = 1;
    cpFlashT = 0.9;
  };

  // big animated "1ST!" placement pop the moment you cross the line
  H.showPlacement = function (pos) {
    const el = $('placement'), big = $('placement-big'), sub = $('placement-sub');
    big.textContent = pos + RR.U.ordinal(pos).toUpperCase();
    big.style.color = pos === 1 ? '#ffd24a' : pos === 2 ? '#dde3e8' : pos === 3 ? '#d0824a' : '#9fb4c0';
    sub.textContent = pos === 1 ? '★ RIVER CHAMP ★' : 'FINISH';
    el.classList.remove('on');
    void el.offsetWidth;                       // restart the CSS animation
    el.classList.add('on');
    setTimeout(() => el.classList.remove('on'), 2700);
  };

  // landmark callouts as you pass them
  H.tagLandmark = function (name) {
    if (name === lastTagged) return;
    lastTagged = name;
    els.tag.textContent = name.toUpperCase();
    els.tag.style.opacity = 1;
    tagT = 2.6;
  };

  H.update = function (dt, boat, race) {
    const speed = Math.hypot(boat.vel.x, boat.vel.z);
    els.speed.textContent = Math.round(speed * 2.237);          // m/s → mph
    // speed vignette: the edges close in as you approach (and boost past) top speed
    if (els.vig) {
      const f = RR.U.clamp((speed / boat.spec.top - 0.7) * 2.0, 0, 1) * 0.5 + boat.boostHeat * 0.2;
      els.vig.style.opacity = f.toFixed(2);
    }
    els.throttle.style.width = Math.round(boat.boostEnergy * 100) + '%';
    els.throttle.style.background = boat.boostHeat > 0.5
      ? 'linear-gradient(90deg,#ffc857,#ff3b30)'
      : 'linear-gradient(90deg,#7ec8e3,#ffc857)';

    if (race) {
      const p = boat.racePos || 1;
      els.pos.textContent = p;
      els.posSuf.textContent = RR.U.ordinal(p);
      els.posTotal.textContent = '/ ' + race.boats.length;
      const total = race.checkpoints.length;
      if (race.route.loop) {
        els.lap.textContent = 'LAP ' + Math.min(race.course.laps, boat.lap + 1) + '/' + race.course.laps;
      } else {
        els.lap.textContent = 'CHECKPOINT ' + Math.min(boat.nextCp, total) + '/' + total;
      }
      els.timer.textContent = RR.U.formatTime(race.time);
      els.wrong.style.display = race.wrongWay ? 'block' : 'none';
    }

    if (cpFlashT > 0) { cpFlashT -= dt; if (cpFlashT <= 0) els.cpFlash.style.opacity = 0; }
    if (tagT > 0) { tagT -= dt; if (tagT <= 0) { els.tag.style.opacity = 0; lastTagged = null; } }
  };

  RR.HUD = H;
})();

</script>
<script>
/* ===== js/ui/minimap.js ===== */
/* River Racer — minimap: the real river outline, rotated north-up, player-centered course strip */
(function () {
  const M = {};
  let cv, ctx, W, Hh;
  let riverShape = null;       // cached Path2D of all channels in world coords

  M.init = function () {
    cv = document.getElementById('minimap');
    ctx = cv.getContext('2d');
    W = cv.width; Hh = cv.height;
    buildShape();
  };

  function buildShape() {
    riverShape = [];
    for (const key in RR.River.paths) {
      if (key.startsWith('lake')) continue;
      const p = RR.River.paths[key];
      // left edge forward, right edge back → closed channel polygon
      const poly = [];
      for (let i = 0; i < p.n; i += 3) {
        const i0 = Math.max(0, i - 1), i1 = Math.min(p.n - 1, i + 1);
        let tx = p.x[i1] - p.x[i0], tz = p.z[i1] - p.z[i0];
        const tl = Math.max(1e-6, Math.hypot(tx, tz)); tx /= tl; tz /= tl;
        poly.push([p.x[i] - tz * p.w[i], p.z[i] + tx * p.w[i]]);
      }
      for (let i = p.n - 1; i >= 0; i -= 3) {
        const i0 = Math.max(0, i - 1), i1 = Math.min(p.n - 1, i + 1);
        let tx = p.x[i1] - p.x[i0], tz = p.z[i1] - p.z[i0];
        const tl = Math.max(1e-6, Math.hypot(tx, tz)); tx /= tl; tz /= tl;
        poly.push([p.x[i] + tz * p.w[i], p.z[i] - tx * p.w[i]]);
      }
      riverShape.push(poly);
    }
  }

  // world→map: north-up (world -z is up on the map)
  const SCALE_TRACK = 0.055;
  function tf(wx, wz, cx, cz, scale) {
    return [W / 2 + (wx - cx) * scale, Hh * 0.58 + (wz - cz) * scale];
  }

  M.draw = function (race, player, boats) {
    ctx.clearRect(0, 0, W, Hh);
    if (!race) return;
    const cx = player.pos.x, cz = player.pos.z;
    const scale = SCALE_TRACK;

    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, W, Hh);
    ctx.clip();

    // lake wash (everything east of the shore)
    const [shoreX] = tf(RR.River.lakeWestX, 0, cx, cz, scale);
    if (shoreX < W) {
      ctx.fillStyle = 'rgba(46,110,140,0.55)';
      ctx.fillRect(shoreX, 0, W - shoreX, Hh);
    }

    // channels
    ctx.fillStyle = 'rgba(84,160,150,0.85)';
    for (const poly of riverShape) {
      ctx.beginPath();
      for (let i = 0; i < poly.length; i++) {
        const [x, y] = tf(poly[i][0], poly[i][1], cx, cz, scale);
        if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
      }
      ctx.closePath();
      ctx.fill();
    }

    // route ahead: bright line with a dark casing so it reads over open lake water too
    const route = race.route;
    ctx.beginPath();
    let started = false;
    const inLapD = route.loop ? player.routeD % route.len : player.routeD;
    const ahead = route.loop ? 2200 : Math.min(2200, route.len - inLapD);
    for (let d = inLapD; d < inLapD + ahead; d += 40) {
      const a = RR.U.pathAt(route, route.loop ? d % route.len : d, M._p || (M._p = {}));
      const [x, y] = tf(a.x, a.z, cx, cz, scale);
      if (started) ctx.lineTo(x, y); else { ctx.moveTo(x, y); started = true; }
    }
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(10,20,30,0.75)'; ctx.lineWidth = 6; ctx.stroke();     // casing
    ctx.strokeStyle = 'rgba(255,205,90,0.95)'; ctx.lineWidth = 3; ctx.stroke();   // bright core

    // checkpoints
    for (let i = player.nextCp; i < Math.min(player.nextCp + 3, race.checkpoints.length); i++) {
      const cp = race.checkpoints[i];
      const [x, y] = tf(cp.x, cp.z, cx, cz, scale);
      ctx.fillStyle = i === player.nextCp ? '#ffc857' : 'rgba(255,200,87,0.45)';
      ctx.beginPath(); ctx.arc(x, y, i === player.nextCp ? 4 : 3, 0, 7); ctx.fill();
    }

    // rivals
    for (const b of boats) {
      if (b === player) continue;
      const [x, y] = tf(b.pos.x, b.pos.z, cx, cz, scale);
      ctx.fillStyle = '#e8604c';
      ctx.beginPath(); ctx.arc(x, y, 2.6, 0, 7); ctx.fill();
    }

    // player arrow
    const px = W / 2, py = Hh * 0.58;
    ctx.save();
    ctx.translate(px, py);
    // north-up: world +z is down, boat forward = (sin h, cos h); the up-pointing glyph needs θ = π − heading
    ctx.rotate(Math.PI - player.heading);
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath();
    ctx.moveTo(0, -6); ctx.lineTo(4.4, 5); ctx.lineTo(0, 2.6); ctx.lineTo(-4.4, 5);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();

    // compass N
    ctx.fillStyle = 'rgba(207,234,247,0.8)';
    ctx.font = 'bold 11px sans-serif';
    ctx.fillText('N', W - 16, 16);
    ctx.strokeStyle = 'rgba(207,234,247,0.5)';
    ctx.beginPath(); ctx.moveTo(W - 12, 20); ctx.lineTo(W - 12, 28); ctx.stroke();

    ctx.restore();
  };

  RR.Minimap = M;
})();

</script>
<script>
/* ===== js/ui/menus.js ===== */
/* River Racer — menu flow: title → vehicle → course → race → results. Keyboard + mouse. */
(function () {
  const MENU = {};
  const $ = (id) => document.getElementById(id);
  let root, screen = 'title', sel = 0, vehicleIdx = 0, courseIdx = 0;
  let onStartRace = null;

  const CHI_STARS = '✶ ✶ ✶ ✶';

  MENU.init = function (startRaceCb) {
    root = $('menu');
    onStartRace = startRaceCb;
    showTitle();
  };

  MENU.screen = () => screen;
  MENU.selection = () => ({ vehicleIdx, courseIdx });

  function html(s) { root.innerHTML = s; root.classList.remove('off'); root.classList.toggle('showroom', screen === 'vehicle'); }
  MENU.hide = function () { root.classList.add('off'); screen = 'none'; };

  // ---------- title ----------
  function showTitle() {
    screen = 'title'; sel = 0;
    html(`
      <div class="stars">${CHI_STARS}</div>
      <div id="title">RIVER<br>RACER</div>
      <div id="subtitle">CHICAGO ·  LAKE MICHIGAN</div>
      <div class="menu-list">
        <div class="menu-item" data-i="0">RACE</div>
        <div class="menu-item" data-i="1">TIME TRIAL</div>
        <div class="menu-item" data-i="2">HOW TO PLAY</div>
      </div>
      <div class="menu-note">↑↓ SELECT &nbsp;·&nbsp; ENTER CONFIRM<br>BUILT ON THE REAL CHICAGO RIVER</div>
    `);
    bindClicks([() => showVehicles(false), () => showVehicles(true), showHelp]);
    paintSel();
    RR.Audio.setMusic(true);
  }

  function showHelp() {
    screen = 'help'; sel = 0;
    html(`
      <div id="select-title">HOW TO PLAY</div>
      <div class="menu-note" style="font-size:15px;max-width:640px;line-height:2.1;">
        <b>W / ↑</b> — throttle &nbsp;&nbsp; <b>S / ↓</b> — brake &amp; reverse &nbsp;&nbsp; <b>A·D / ←·→</b> — steer<br>
        <b>SHIFT</b> — boost (watch the meter under your speed — spend it wisely) &nbsp;&nbsp; <b>C</b> — camera &nbsp;&nbsp; <b>R</b> — reset to course<br>
        <b>ESC</b> — pause &nbsp;&nbsp; Gamepad and touch supported.<br><br>
        Thread the checkpoint buoys — <span style="color:#ff5b4c">red LEFT</span>, <span style="color:#2ecc71">green RIGHT</span>.
        The river is narrow and the seawalls are real concrete; the lake is open water with real chop.<br>
        Cut clean lines under the bridges, save boost for the straights, and mind the lock walls.
      </div>
      <div class="menu-list"><div class="menu-item sel" data-i="0">BACK</div></div>
    `);
    bindClicks([showTitle]);
  }

  // ---------- vehicle select: live 3D showroom — the boat idles on the lake mid-screen ----------
  let timeTrial = false;
  function showVehicles(tt) {
    screen = 'vehicle'; sel = vehicleIdx; timeTrial = tt;
    const cards = RR.Boats.CATALOG.map((v, i) => `
      <div class="card" data-i="${i}">
        <div class="tag">${v.kind.toUpperCase()}</div>
        <h3>${v.name}</h3>
        <canvas width="220" height="110" id="vcard-${i}"></canvas>
      </div>`).join('');
    html(`
      <div id="select-title">PICK YOUR RIDE</div>
      <div id="select-sub">${timeTrial ? 'TIME TRIAL' : 'RACE'} · ←→ SELECT · ENTER CONFIRM · BKSP BACK</div>
      <div id="ride-panel">
        <div class="tag" id="ride-kind"></div>
        <h3 id="ride-name"></h3>
        <div class="desc" id="ride-desc"></div>
        <div id="ride-stats"></div>
      </div>
      <div id="cards" class="dock">${cards}</div>
    `);
    bindCards(RR.Boats.CATALOG.length, (i) => { vehicleIdx = i; showCourses(); });
    drawVehicleCards();
    paintSel();
  }

  function updateRidePanel(i) {
    const v = RR.Boats.CATALOG[i];
    const kind = $('ride-kind');
    if (!v || !kind) return;
    kind.textContent = v.kind.toUpperCase();
    $('ride-name').textContent = v.name;
    $('ride-desc').textContent = v.desc;
    const control = (v.turn / 2.5) * 0.5 + (v.grip / 3.7) * 0.5;
    $('ride-stats').innerHTML =
      stat('SPEED', v.top / 46) + stat('ACCEL', v.accel / 15.5) +
      stat('CONTROL', control) + stat('BOOST', (v.boost - 1) / 0.3);
    if (MENU.onVehicleFocus) MENU.onVehicleFocus(i);
  }

  function stat(label, f) {
    return `<div class="statbar"><span style="width:52px">${label}</span><div class="track"><div class="fill" style="width:${Math.round(f * 100)}%"></div></div></div>`;
  }

  // little side-view sketches on 2D canvas — cheap, charming
  function drawVehicleCards() {
    RR.Boats.CATALOG.forEach((v, i) => {
      const c = $('vcard-' + i);
      if (!c) return;
      const ctx = c.getContext('2d');
      const hull = '#' + v.hull.toString(16).padStart(6, '0');
      const deck = '#' + v.deck.toString(16).padStart(6, '0');
      const acc = '#' + v.accent.toString(16).padStart(6, '0');
      ctx.clearRect(0, 0, 220, 110);
      // water line
      ctx.strokeStyle = 'rgba(126,200,227,0.5)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(8, 84);
      for (let x = 8; x < 212; x += 8) ctx.lineTo(x, 84 + Math.sin(x * 0.15 + i) * 2.5);
      ctx.stroke();
      ctx.save();
      ctx.translate(110, 70);
      const draw = {
        jetski() {
          ctx.fillStyle = hull; poly([[-38, 8], [30, 8], [44, -2], [30, -8], [-30, -10], [-42, -2]]);
          ctx.fillStyle = deck; poly([[-26, -8], [8, -8], [2, -20], [-20, -20]]);
          ctx.fillStyle = acc; poly([[8, -8], [26, -6], [30, -14], [12, -16]]);
        },
        speedboat() {
          ctx.fillStyle = hull; poly([[-70, 6], [52, 6], [78, -6], [50, -12], [-66, -12]]);
          ctx.fillStyle = deck; poly([[-62, -12], [46, -12], [40, -20], [-56, -20]]);
          ctx.fillStyle = acc; ctx.fillRect(-50, -18, 70, 3);
        },
        f1() {
          ctx.fillStyle = hull; poly([[-60, 6], [40, 6], [70, -4], [36, -8], [-56, -10]]);
          ctx.fillStyle = deck; poly([[-20, -8], [20, -8], [14, -22], [-12, -22]]);
          ctx.fillStyle = acc; ctx.fillRect(-56, -20, 26, 4);
        },
        runabout() {
          ctx.fillStyle = hull; poly([[-60, 6], [48, 6], [66, -8], [44, -13], [-56, -13]]);
          ctx.fillStyle = deck; poly([[-54, -13], [42, -13], [38, -18], [-48, -18]]);
          ctx.fillStyle = acc; ctx.fillRect(-40, -17, 60, 2);
        },
      };
      (draw[v.kind] || draw.speedboat)();
      ctx.restore();
      function poly(pts) { ctx.beginPath(); pts.forEach((p, j) => j ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); ctx.fill(); }
    });
  }

  // ---------- difficulty ----------
  let difficulty = (() => { try { return parseFloat(localStorage.getItem('rr_diff')) || 1; } catch (e) { return 1; } })();
  MENU.difficulty = () => difficulty;
  const DIFFS = [
    { name: 'ROOKIE', v: 0.7, desc: 'Rivals cruise the scenic route. A friendly Sunday on the river.' },
    { name: 'SKIPPER', v: 1.0, desc: 'A fair fight from Wolf Point to the lighthouse.' },
    { name: 'LEGEND', v: 1.3, desc: 'They run the perfect line, never lift, and show no mercy.' },
  ];
  function showDifficulty() {
    screen = 'difficulty';
    sel = Math.max(0, DIFFS.findIndex((d) => d.v === difficulty));
    const rows = DIFFS.map((d, i) => `<div class="menu-item" data-i="${i}">${d.name}</div>`).join('');
    html(`
      <div id="select-title">HOW TOUGH ARE THE RIVALS?</div>
      <div id="select-sub">↑↓ SELECT · ENTER RACE · BKSP BACK</div>
      <div class="menu-list">${rows}</div>
      <div class="menu-note" id="diff-desc" style="max-width:520px;">${DIFFS[sel].desc}</div>
    `);
    bindClicks(DIFFS.map((d) => () => {
      difficulty = d.v;
      try { localStorage.setItem('rr_diff', String(d.v)); } catch (e) { /* fine */ }
      launch();
    }));
    paintSel();
  }

  // ---------- course select ----------
  function showCourses() {
    screen = 'course'; sel = courseIdx;
    const cards = RR.Race.COURSES.map((c, i) => {
      const best = RR.Race.best(c.id);
      return `
      <div class="card" data-i="${i}">
        <div class="tag">${c.loop ? c.laps + ' LAPS' : 'SPRINT'}</div>
        <h3>${c.name}</h3>
        <canvas width="220" height="110" id="ccard-${i}"></canvas>
        <div class="desc">${c.desc}</div>
        <div class="statbar"><span>BEST&nbsp;</span><span style="color:#ffc857">${best ? RR.U.formatTime(best) : '—'}</span></div>
      </div>`;
    }).join('');
    html(`
      <div id="select-title">PICK YOUR WATER</div>
      <div id="select-sub">←→ SELECT · ENTER RACE · BKSP BACK</div>
      <div id="cards">${cards}</div>
    `);
    bindCards(RR.Race.COURSES.length, (i) => { courseIdx = i; timeTrial ? launch() : showDifficulty(); });
    drawCourseCards();
    paintSel();
  }

  // top-down course thumbnails from the actual channel polylines
  function drawCourseCards() {
    RR.Race.COURSES.forEach((c, i) => {
      const cv = $('ccard-' + i);
      if (!cv) return;
      const ctx = cv.getContext('2d');
      ctx.clearRect(0, 0, 220, 110);
      // bounds over all channels
      let minX = 1e9, maxX = -1e9, minZ = 1e9, maxZ = -1e9;
      for (const key in RR.River.paths) {
        const p = RR.River.paths[key];
        for (let j = 0; j < p.n; j += 6) {
          minX = Math.min(minX, p.x[j]); maxX = Math.max(maxX, p.x[j]);
          minZ = Math.min(minZ, p.z[j]); maxZ = Math.max(maxZ, p.z[j]);
        }
      }
      const s = Math.min(190 / (maxX - minX), 86 / (maxZ - minZ));
      const ox = 110 - (minX + maxX) / 2 * s, oy = 55 - (minZ + maxZ) / 2 * s;
      // all channels faint
      ctx.strokeStyle = 'rgba(126,200,227,0.25)';
      ctx.lineWidth = 3; ctx.lineCap = 'round';
      for (const key in RR.River.paths) strokePath(RR.River.paths[key]);
      // course route bright
      ctx.strokeStyle = '#ffc857';
      ctx.lineWidth = 2.4;
      for (const seg of c.segments) {
        const p = RR.River.paths[seg.path];
        if (p) strokePath(p, seg.fromFrac || 0, seg.toFrac == null ? 1 : seg.toFrac);
      }
      function strokePath(p, f0, f1) {
        const j0 = Math.floor((f0 || 0) * (p.n - 1)), j1 = Math.ceil((f1 == null ? 1 : f1) * (p.n - 1));
        ctx.beginPath();
        for (let j = j0; j <= j1; j += 4) {
          const x = p.x[j] * s + ox, y = p.z[j] * s + oy;
          if (j === j0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
    });
  }

  // ---------- results ----------
  MENU.showResults = function (results, courseId) {
    screen = 'results'; sel = 0;
    const best = RR.Race.best(courseId);
    const rows = results.map((r, i) => `
      <div class="result-row ${r.boat.isPlayer ? 'you' : ''}">
        <span>${i + 1}${RR.U.ordinal(i + 1).toLowerCase()} &nbsp; ${r.boat.isPlayer ? 'YOU' : r.boat.pilotName}</span>
        <span class="t">${isFinite(r.time) ? RR.U.formatTime(r.time) : 'DNF'}</span>
      </div>`).join('');
    html(`
      <div id="select-title">${results[0] && results[0].boat.isPlayer ? '🏆 RIVER CHAMP' : 'RACE COMPLETE'}</div>
      <div id="select-sub">BEST: ${best ? RR.U.formatTime(best) : '—'}</div>
      <div id="results-list">${rows}</div>
      <div class="menu-list" style="margin-top:26px;">
        <div class="menu-item" data-i="0">RACE AGAIN</div>
        <div class="menu-item" data-i="1">CHANGE COURSE</div>
        <div class="menu-item" data-i="2">TITLE SCREEN</div>
      </div>
    `);
    bindClicks([launch, showCourses, showTitle]);
    paintSel();
  };

  // ---------- pause ----------
  MENU.showPause = function () {
    screen = 'pause'; sel = 0;
    html(`
      <div id="select-title">PAUSED</div>
      <div class="menu-list">
        <div class="menu-item" data-i="0">RESUME</div>
        <div class="menu-item" data-i="1">RESTART RACE</div>
        <div class="menu-item" data-i="2">QUIT TO TITLE</div>
      </div>
    `);
    bindClicks([() => { MENU.hide(); if (MENU.onResume) MENU.onResume(); },
                () => { launch(); },
                () => { if (MENU.onQuit) MENU.onQuit(); showTitle(); }]);
    paintSel();
  };

  function launch() {
    MENU.hide();
    RR.Audio.setMusic(false);
    onStartRace(courseIdx, vehicleIdx, timeTrial);
  }

  // ---------- selection plumbing ----------
  let actions = [];
  function bindClicks(fns) {
    actions = fns;
    root.querySelectorAll('.menu-item').forEach((el) => {
      el.addEventListener('click', () => { sel = +el.dataset.i; RR.Audio.uiSelect(); actions[sel](); });
      el.addEventListener('mouseenter', () => { sel = +el.dataset.i; paintSel(); });
    });
  }
  function bindCards(n, confirm) {
    actions = [];
    for (let i = 0; i < n; i++) actions.push(() => confirm(i));
    root.querySelectorAll('.card').forEach((el) => {
      el.addEventListener('click', () => { sel = +el.dataset.i; RR.Audio.uiSelect(); confirm(sel); });
      el.addEventListener('mouseenter', () => { sel = +el.dataset.i; paintSel(); });
    });
  }
  function paintSel() {
    root.querySelectorAll('.menu-item, .card').forEach((el) => {
      el.classList.toggle('sel', +el.dataset.i === sel);
    });
    const dd = $('diff-desc');
    if (dd && screen === 'difficulty' && DIFFS[sel]) dd.textContent = DIFFS[sel].desc;
    if (screen === 'vehicle') updateRidePanel(sel);
  }

  window.addEventListener('keydown', (e) => {
    if (screen === 'none') return;
    RR.Audio.init();
    const vertical = screen === 'title' || screen === 'results' || screen === 'pause' || screen === 'help' || screen === 'difficulty';
    if ((vertical && e.code === 'ArrowUp') || (!vertical && e.code === 'ArrowLeft')) { sel = (sel - 1 + actions.length) % actions.length; RR.Audio.uiMove(); paintSel(); }
    else if ((vertical && e.code === 'ArrowDown') || (!vertical && e.code === 'ArrowRight')) { sel = (sel + 1) % actions.length; RR.Audio.uiMove(); paintSel(); }
    else if (e.code === 'Enter' || e.code === 'Space') { RR.Audio.uiSelect(); if (actions[sel]) actions[sel](); }
    else if (e.code === 'Backspace' || e.code === 'Escape') {
      if (screen === 'vehicle' || screen === 'help') showTitle();
      else if (screen === 'course') showVehicles(timeTrial);
      else if (screen === 'difficulty') showCourses();
      else if (screen === 'pause') { MENU.hide(); if (MENU.onResume) MENU.onResume(); }
      e.preventDefault();
    }
  });

  MENU.toTitle = showTitle;

  RR.Menus = MENU;
})();

</script>
<script>
/* ===== js/main.js ===== */
/* River Racer — bootstrap + game flow */
(function () {
  const $ = (id) => document.getElementById(id);
  let boats = [], player = null, pilots = [];
  let mode = 'menu';                       // menu | race | paused
  let raceState = null;
  let landmarkTags = [];                   // {x, z, name, r2} for HUD callouts

  function setLoad(f, msg) {
    $('load-fill').style.width = Math.round(f * 100) + '%';
    if (msg) $('load-msg').textContent = msg;
  }

  const STEPS = [
    ['SURVEYING THE RIVER…', () => { RR.River.init(); }],
    ['POURING LAKE MICHIGAN…', () => { RR.Sky.init(); RR.Water.init(); }],
    ['RAISING THE SKYLINE…', () => { RR.City.init(); }],
    ['DRESSING THE LANDMARKS…', () => { landmarkTags = RR.Landmarks.init(); }],
    ['LOWERING THE BRIDGES…', () => { RR.Bridges.init(); RR.Ramps.init(); }],
    ['LAYING THE RIVERWALK…', () => { RR.Riverwalk.init(); }],
    ['OPENING THE LOCK…', () => { RR.Lake.init(); }],
    ['RIGGING THE SAILBOATS…', () => { RR.Scenery.init(); if (RR.Eggs) { RR.Eggs.init(); if (RR.Eggs.tags) landmarkTags = landmarkTags.concat(RR.Eggs.tags); } }],
    ['FILLING THE STREETS…', () => { RR.Life.init(); RR.Fireworks.init(); }],
    ['FUELING THE BOATS…', () => { RR.FX.init(); RR.HUD.init(); RR.Minimap.init(); }],
  ];

  function boot() {
    RR.Engine.init();
    let i = 0;
    (function next() {
      if (i < STEPS.length) {
        setLoad(i / STEPS.length, STEPS[i][0]);
        const fn = STEPS[i][1];
        i++;
        requestAnimationFrame(() => { fn(); next(); });
      } else {
        finishBoot();
      }
    })();
  }

  // showroom: the vehicle-select boat idles live on the lake, skyline behind it
  const SHOW = { x: 2150, z: 620 };
  let showBoat = null, showIdx = -1;

  function finishBoot() {
    setLoad(1, 'READY');
    if (RR.Theme) { RR.Theme.buildLamps(); RR.Theme.apply('day'); }
    RR.Menus.init(startRace);
    RR.Menus.onVehicleFocus = (i) => {
      if (showIdx === i && showBoat) return;
      if (showBoat) RR.Engine.scene.remove(showBoat);
      showBoat = RR.Boats.build(RR.Boats.CATALOG[i]);
      showBoat.position.set(SHOW.x, 0.3, SHOW.z);
      RR.Engine.scene.add(showBoat);
      showIdx = i;
    };
    RR.Menus.onResume = () => { mode = 'race'; };
    RR.Menus.onQuit = quitToTitle;
    RR.Engine.onUpdate(update);
    RR.Engine.start();
    setTimeout(() => { $('loading').style.display = 'none'; }, 250);
    window.RRTest.ready = true;
  }

  // ---------- race lifecycle ----------
  function clearBoats() {
    for (const b of boats) RR.Engine.scene.remove(b.mesh);
    RR.FX.clearBoats();
    boats = []; pilots = []; player = null;
  }

  function startRace(courseIdx, vehicleIdx, timeTrial) {
    clearBoats();
    const N = timeTrial ? 1 : 6;
    const catalog = RR.Boats.CATALOG;
    for (let i = 0; i < N; i++) {
      const spec = i === 0 ? catalog[vehicleIdx] : catalog[(vehicleIdx + 1 + i) % catalog.length];
      const mesh = RR.Boats.build(spec);
      RR.Engine.scene.add(mesh);
      const b = RR.Physics.createBoat(spec, mesh);
      b.isPlayer = i === 0;
      boats.push(b);
      RR.FX.registerBoat(b);
    }
    player = boats[0];

    raceState = RR.Race.start(courseIdx, boats, player);

    pilots = [];
    const diff = RR.Menus && RR.Menus.difficulty ? RR.Menus.difficulty() : 1;
    for (let i = 1; i < boats.length; i++) {
      const p = RR.AI.createPilot(boats[i], { path: raceState.route }, i - 1, diff);
      boats[i].pilotName = p.name;
      pilots.push(p);
    }

    // effect + audio hooks
    for (const b of boats) {
      b.onCrash = (sev, nx, nz) => {
        RR.FX.splashBurst(b.pos.x, b.pos.y, b.pos.z, sev);
        if (b.isPlayer) { RR.Audio.thud(sev); RR.Audio.splash(sev * 0.7); RR.Camera.kick(sev * 0.9); }
      };
      b.onSplashdown = (imp) => {
        RR.FX.splashBurst(b.pos.x, b.pos.y, b.pos.z, imp);
        if (b.isPlayer) { RR.Audio.splash(imp); RR.Camera.kick(imp * 0.5); }
      };
      b.onLaunch = () => { if (b.isPlayer) RR.Audio.seagull(); };
      b.onBump = (sev, nx, nz) => {
        RR.FX.splashBurst(b.pos.x, b.pos.y, b.pos.z, sev * 0.6);
        if (b.isPlayer) { RR.Audio.thud(sev * 0.9); RR.Camera.kick(sev * 0.7); }
        else { b.bumpRecover = Math.max(b.bumpRecover || 0, 0.30 + sev * 0.55); }  // a solid hit rattles the AI
      };
    }

    RR.Race.onCount = (n) => { RR.HUD.countdown(n); if (n > 0) RR.Audio.countdownBeep(false); else { RR.Audio.countdownBeep(true); RR.Audio.airhorn(); } };
    RR.Race.onCheckpoint = (n, total) => {
      RR.HUD.checkpointFlash(n, total); RR.Audio.checkpoint();
      if (player) { player.boostEnergy = Math.min(1, player.boostEnergy + 0.45); RR.Camera.kick(0.25); RR.HUD.flash('+BOOST'); }
    };
    RR.Race.onLap = () => { RR.Audio.checkpoint(); };
    RR.Race.onPlayerFinish = (pos) => {
      RR.Audio.finishFanfare(pos === 1); RR.Audio.airhorn(); RR.HUD.showPlacement(pos);
      const g = raceState && raceState.finishGate;
      if (g) {
        if (RR.FX.confetti) RR.FX.confetti(g.x, 12, g.z, 260);
        if (RR.Fireworks && RR.Fireworks.burstAt) {
          RR.Fireworks.burstAt(g.x - 18, 26, g.z, [1, 0.82, 0.3]);
          RR.Fireworks.burstAt(g.x + 16, 32, g.z + 8, null);
          setTimeout(() => RR.Fireworks.burstAt && RR.Fireworks.burstAt(g.x, 30, g.z - 10, [0.42, 0.72, 1]), 450);
        }
      }
    };
    RR.Race.onRaceOver = (results) => {
      mode = 'results';
      RR.HUD.show(false);
      RR.Audio.stopEngine();
      if (RR.Audio.setRaceMusic) RR.Audio.setRaceMusic(false);
      RR.Menus.showResults(results, raceState.course.id);
    };

    RR.Audio.init();
    RR.Audio.startEngine(player.spec.kind);
    if (RR.Audio.setRaceMusic) RR.Audio.setRaceMusic(true);
    RR.HUD.show(true);
    RR.Camera.setMode(0);
    RR.Camera.snapTo(player);
    mode = 'race';
  }

  function quitToTitle() {
    mode = 'menu';
    RR.HUD.show(false);
    RR.Audio.stopEngine();
    if (RR.Audio.setRaceMusic) RR.Audio.setRaceMusic(false);
    clearBoats();
    raceState = null;
  }

  function resetToCourse() {
    if (!raceState || !player) return;
    const pt = RR.U.pathAt(raceState.route, Math.max(6, (raceState.route.loop ? player.routeD % raceState.route.len : player.routeD) - 8), {});
    player.pos.set(pt.x, 0.2, pt.z);
    player.heading = Math.atan2(pt.tx, pt.tz);
    player.vel.x = 0; player.vel.z = 0; player.angVel = 0;
    player.airborne = false; player.vy = 0;
    RR.Camera.snapTo(player);
  }

  // ---------- global keys ----------
  window.addEventListener('keydown', (e) => {
    if (e.code === 'KeyC' && mode === 'race') RR.Camera.cycle();
    if (e.code === 'KeyR' && mode === 'race') resetToCourse();
    if (e.code === 'KeyN' && RR.Theme) { const m = RR.Theme.toggle(); if (RR.HUD && RR.HUD.flash) RR.HUD.flash(m.toUpperCase()); }
    if (e.code === 'KeyG' && RR.Theme && RR.Theme.toggleGreenRiver) {
      const on = RR.Theme.toggleGreenRiver();
      if (RR.HUD && RR.HUD.flash) RR.HUD.flash(on ? 'RIVER DYED GREEN' : 'RIVER RESTORED');
    }
    if (e.code === 'KeyP' && (mode === 'race' || mode === 'photo')) togglePhotoMode();
    if (e.code === 'Escape' && mode === 'photo') togglePhotoMode();
    if (e.code === 'Escape' && mode === 'race') { mode = 'paused'; RR.Menus.showPause(); }
    RR.Audio.init(); RR.Audio.resume();
  }, { once: false });
  window.addEventListener('pointerdown', () => { RR.Audio.init(); RR.Audio.resume(); });

  // ---------- per-frame ----------
  const aiCtl = { throttle: 0, brake: 0, steer: 0, boost: false };
  let tagCooldown = 0;
  let photoAngle = 0;

  // freeze the sim and swing a slow cinematic camera around the boat for screenshots
  function togglePhotoMode() {
    if (mode === 'race') {
      mode = 'photo'; RR.HUD.show(false); RR.Audio.stopEngine();
      if (RR.HUD.flash) RR.HUD.flash('PHOTO MODE');
    } else if (mode === 'photo') {
      mode = 'race'; RR.HUD.show(true);
      if (player) { RR.Audio.startEngine(player.spec.kind); RR.Camera.snapTo(player); }
    }
  }

  function update(dt, t) {
    if (RR.Life) RR.Life.update(dt, t);          // crowds + traffic animate in every scene
    if (RR.Fireworks) RR.Fireworks.update(dt);
    if (mode === 'menu' || mode === 'results') {
      if (RR.Water && RR.Water.material) RR.Water.material.uniforms.uNumBoats.value = 0;  // no stale foam
      if (RR.Menus.screen() === 'vehicle' && showBoat) {
        // showroom: slow orbit around the boat bobbing on the lake chop
        const amp = RR.River.waveAmp(SHOW.x, SHOW.z);
        showBoat.position.y = RR.U.waterHeight(SHOW.x, SHOW.z, t, amp) + 0.18;
        showBoat.rotation.set(Math.sin(t * 0.7) * 0.035, t * 0.4, Math.sin(t * 0.55) * 0.045);
        const cam = RR.Engine.camera;
        const oa = t * 0.14, r = 10.5;
        cam.position.set(SHOW.x + Math.sin(oa) * r, 3.4 + Math.sin(t * 0.3) * 0.5, SHOW.z + Math.cos(oa) * r);
        cam.up.set(0, 1, 0);
        cam.lookAt(SHOW.x, showBoat.position.y + 0.9, SHOW.z);
        if (cam.fov !== 50) { cam.fov = 50; cam.updateProjectionMatrix(); }
        return;
      }
      if (showBoat && RR.Menus.screen() !== 'vehicle') { RR.Engine.scene.remove(showBoat); showBoat = null; showIdx = -1; }
      // attract flythrough behind the menus
      const main = RR.River.paths.main;
      if (main) RR.Camera.flyover(dt, main);
      RR.Race.animateGates && raceState && RR.Race.animateGates(t);
      return;
    }
