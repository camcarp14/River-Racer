<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>River Racer — Chicago</title>
<style>
  :root {
    --chi-blue: #7ec8e3;      /* Chicago flag light blue */
    --chi-red: #ff3b30;       /* Chicago flag star red */
    --ink: #0b1e2d;
    --gold: #ffc857;
    --hud-bg: rgba(6, 20, 32, 0.72);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0b1e2d; }
  body { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; color: #eaf6ff; user-select: none; -webkit-user-select: none; }
  #gl { position: fixed; inset: 0; display: block; }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; display: none; }
  #hud.on { display: block; }
  .hud-panel { position: absolute; background: var(--hud-bg); border: 1px solid rgba(126,200,227,.35); border-radius: 10px; backdrop-filter: blur(4px); }
  #speedo { right: 22px; bottom: 20px; width: 190px; padding: 12px 16px 10px; text-align: right; }
  #speed-num { font-size: 52px; font-weight: 800; font-style: italic; line-height: 1; letter-spacing: -2px; color: #fff; text-shadow: 0 0 18px rgba(126,200,227,.8); }
  #speed-unit { font-size: 13px; letter-spacing: 3px; color: var(--chi-blue); font-weight: 700; }
  #throttle-bar { height: 5px; background: rgba(255,255,255,.15); border-radius: 3px; margin-top: 8px; overflow: hidden; }
  #throttle-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--chi-blue), var(--gold)); border-radius: 3px; }
  #race-info { left: 22px; top: 18px; padding: 10px 18px; }
  #pos-big { font-size: 44px; font-weight: 800; font-style: italic; line-height: 1; color: var(--gold); text-shadow: 0 2px 12px rgba(0,0,0,.6); display: inline-block; }
  #pos-suffix { font-size: 18px; font-weight: 700; color: var(--gold); vertical-align: top; }
  #pos-total { font-size: 15px; color: #9fc9dd; margin-left: 6px; }
  #lap-line { font-size: 13px; letter-spacing: 2px; color: var(--chi-blue); font-weight: 700; margin-top: 3px; }
  #timer { left: 50%; top: 16px; transform: translateX(-50%); padding: 8px 22px; font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 1px; }
  #timer small { display: block; font-size: 10px; letter-spacing: 3px; color: var(--chi-blue); text-align: center; }
  #checkpoint-flash { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); font-size: 28px; font-weight: 800; font-style: italic; color: var(--gold); text-shadow: 0 0 22px rgba(255,200,87,.9); opacity: 0; transition: opacity .25s; }
  #wrongway { position: absolute; left: 50%; top: 32%; transform: translateX(-50%); font-size: 40px; font-weight: 900; color: var(--chi-red); text-shadow: 0 0 24px rgba(255,59,48,.8); display: none; animation: blink .5s steps(1) infinite; }
  #placement { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; pointer-events: none; z-index: 12; }
  #placement.on { display: flex; }
  #placement-big { font-size: 150px; font-weight: 900; font-style: italic; letter-spacing: 4px; text-shadow: 0 8px 44px rgba(0,0,0,.65); animation: placepop .75s cubic-bezier(.2,2.2,.4,1) both; }
  #placement-sub { font-size: 26px; font-weight: 700; letter-spacing: 10px; color: #e8f4fa; text-shadow: 0 3px 16px rgba(0,0,0,.6); animation: placesub .5s ease-out .35s both; }
  @keyframes placepop { 0% { transform: scale(.1) rotate(-9deg); opacity: 0; } 60% { transform: scale(1.18) rotate(2deg); opacity: 1; } 100% { transform: scale(1) rotate(0); opacity: 1; } }
  @keyframes placesub { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  #vignette { position: absolute; inset: 0; pointer-events: none; z-index: 4; opacity: 0;
    background: radial-gradient(ellipse at center, transparent 52%, rgba(4,10,18,.55) 88%, rgba(2,6,12,.8) 100%); }
  @keyframes blink { 50% { opacity: .15; } }
  #countdown { position: absolute; left: 50%; top: 38%; transform: translate(-50%,-50%); font-size: 140px; font-weight: 900; font-style: italic; color: #fff; text-shadow: 0 0 40px rgba(126,200,227,.9), 0 6px 0 rgba(0,0,0,.35); display: none; }
  #minimap { position: absolute; right: 22px; top: 18px; width: 200px; height: 260px; border-radius: 12px; border: 1px solid rgba(126,200,227,.35); background: var(--hud-bg); }
  #landmark-tag { position: absolute; left: 50%; bottom: 108px; transform: translateX(-50%); font-size: 15px; letter-spacing: 2px; font-weight: 700; color: #cfeaf7; background: var(--hud-bg); border: 1px solid rgba(126,200,227,.3); border-radius: 20px; padding: 6px 18px; opacity: 0; transition: opacity .5s; }
  #boost-hint { position: absolute; left: 22px; bottom: 20px; font-size: 12px; color: #9fc9dd; background: var(--hud-bg); border-radius: 8px; padding: 8px 12px; line-height: 1.7; border: 1px solid rgba(126,200,227,.2); }
  #boost-hint b { color: #fff; }

  /* ---------- Menus ---------- */
  #menu { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; z-index: 10; }
  #menu.off { display: none; }
  .stars { letter-spacing: 12px; color: var(--chi-red); font-size: 22px; text-shadow: 0 0 12px rgba(255,59,48,.5); }
  #title { font-size: clamp(54px, 9vw, 118px); font-weight: 900; font-style: italic; letter-spacing: -3px; line-height: .95; text-align: center;
           background: linear-gradient(180deg, #ffffff 25%, var(--chi-blue) 60%, #2d8bb5 100%);
           -webkit-background-clip: text; background-clip: text; color: transparent;
           filter: drop-shadow(0 4px 0 rgba(8,40,60,.9)) drop-shadow(0 10px 30px rgba(0,0,0,.5)); }
  #subtitle { font-size: clamp(13px, 1.6vw, 19px); letter-spacing: 8px; color: var(--gold); font-weight: 700; margin-top: 10px; text-shadow: 0 2px 8px rgba(0,0,0,.7); }
  .menu-list { margin-top: 44px; display: flex; flex-direction: column; gap: 10px; min-width: 340px; }
  .menu-item { pointer-events: auto; cursor: pointer; text-align: center; font-size: 21px; font-weight: 700; letter-spacing: 3px; padding: 13px 30px;
               color: #d7edf8; background: rgba(6,20,32,.68); border: 1px solid rgba(126,200,227,.25); border-radius: 10px; transition: all .12s; }
  .menu-item.sel, .menu-item:hover { background: rgba(126,200,227,.22); border-color: var(--chi-blue); color: #fff; transform: scale(1.04); box-shadow: 0 0 24px rgba(126,200,227,.25); }
  .menu-item.dim { opacity: .45; }
  .menu-note { margin-top: 26px; font-size: 12px; letter-spacing: 2px; color: #8fb8cc; text-align: center; line-height: 2; }
  .menu-note b { color: #d7edf8; }
  #select-title { font-size: 34px; font-weight: 800; font-style: italic; letter-spacing: 2px; margin-bottom: 6px; text-shadow: 0 2px 10px rgba(0,0,0,.8); }
  #select-sub { font-size: 13px; letter-spacing: 4px; color: var(--chi-blue); margin-bottom: 24px; text-shadow: 0 1px 4px rgba(0,0,0,.9); background: rgba(6,20,32,.55); padding: 4px 14px; border-radius: 12px; }
  #cards { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 1100px; }
  .card { pointer-events: auto; cursor: pointer; width: 235px; background: rgba(6,20,32,.78); border: 1px solid rgba(126,200,227,.22); border-radius: 14px; padding: 14px; transition: all .15s; }
  .card.sel { border-color: var(--gold); box-shadow: 0 0 30px rgba(255,200,87,.28); transform: translateY(-6px); }
  .card h3 { font-size: 17px; font-style: italic; letter-spacing: 1px; color: #fff; }
  .card .tag { font-size: 10px; letter-spacing: 2px; color: var(--gold); font-weight: 700; }
  .card canvas { width: 100%; height: 110px; border-radius: 8px; background: rgba(11,30,45,.6); margin: 8px 0; }
  .card .desc { font-size: 11.5px; color: #a8cbdc; line-height: 1.5; min-height: 50px; }
  /* showroom (vehicle select): boat renders live in 3D center-screen; UI docks to the edges */
  #menu.showroom { justify-content: flex-start; }
  #menu.showroom #select-title { position: absolute; top: 26px; left: 0; right: 0; text-align: center; }
  #menu.showroom #select-sub { position: absolute; top: 76px; left: 0; right: 0; text-align: center; }
  #ride-panel { position: absolute; left: 34px; top: 50%; transform: translateY(-50%); width: 315px; background: rgba(6,20,32,.72); border: 1px solid rgba(126,200,227,.25); border-radius: 14px; padding: 20px; }
  #ride-panel h3 { font-size: 27px; font-style: italic; color: #fff; letter-spacing: 1px; margin: 4px 0 10px; }
  #ride-panel .desc { min-height: 64px; font-size: 12.5px; }
  #ride-panel .statbar { margin-top: 7px; }
  #cards.dock { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); flex-wrap: nowrap; }
  #cards.dock .card { width: 132px; padding: 8px 10px; }
  #cards.dock .card canvas { height: 56px; }
  #cards.dock .card .desc, #cards.dock .card .statbar { display: none; }
  #cards.dock .card h3 { font-size: 12px; min-height: 28px; }
  .statbar { display: flex; align-items: center; gap: 8px; margin-top: 5px; font-size: 10px; letter-spacing: 1px; color: #9fc9dd; }
  .statbar .track { flex: 1; height: 4px; background: rgba(255,255,255,.12); border-radius: 2px; }
  .statbar .fill { height: 100%; border-radius: 2px; background: linear-gradient(90deg, var(--chi-blue), var(--gold)); }
  #results-list { margin-top: 24px; min-width: 460px; }
  .result-row { display: flex; justify-content: space-between; padding: 10px 22px; margin: 6px 0; background: rgba(6,20,32,.7); border-radius: 8px; border: 1px solid rgba(126,200,227,.15); font-size: 17px; }
  .result-row.you { border-color: var(--gold); background: rgba(255,200,87,.12); font-weight: 800; }
  .result-row .t { font-variant-numeric: tabular-nums; color: #9fc9dd; }
  #fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .4s; z-index: 50; }
  #loading { position: fixed; inset: 0; background: #0b1e2d; z-index: 100; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 18px; }
  #loading .bar { width: 280px; height: 6px; background: rgba(126,200,227,.15); border-radius: 3px; overflow: hidden; }
  #loading .fill { width: 0%; height: 100%; background: var(--chi-blue); transition: width .2s; }
  #loading .msg { font-size: 12px; letter-spacing: 4px; color: var(--chi-blue); }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="loading"><div id="load-title" style="font-size:28px;font-weight:900;font-style:italic;letter-spacing:-1px;">RIVER RACER</div><div class="bar"><div class="fill" id="load-fill"></div></div><div class="msg" id="load-msg">DREDGING THE RIVER…</div></div>

<div id="hud">
  <div id="race-info" class="hud-panel"><span id="pos-big">1</span><span id="pos-suffix">ST</span><span id="pos-total">/ 6</span><div id="lap-line">CHECKPOINT 0/12</div></div>
  <div id="timer" class="hud-panel"><small>RACE TIME</small><span id="timer-num">0:00.00</span></div>
  <canvas id="minimap" width="200" height="260"></canvas>
  <div id="speedo" class="hud-panel"><div id="speed-num">0</div><div id="speed-unit">MPH</div><div id="throttle-bar"><div id="throttle-fill"></div></div></div>
  <div id="checkpoint-flash"></div>
  <div id="wrongway">WRONG WAY HOMIE</div>
  <div id="placement"><div id="placement-big"></div><div id="placement-sub"></div></div>
  <div id="vignette"></div>
  <div id="countdown"></div>
  <div id="landmark-tag"></div>
  <div id="boost-hint"><b>W/↑</b> throttle &nbsp;<b>A·D/←·→</b> steer &nbsp;<b>S/↓</b> brake<br><b>SHIFT</b> boost &nbsp;<b>C</b> camera &nbsp;<b>N</b> time of day &nbsp;<b>G</b> green river &nbsp;<b>P</b> photo &nbsp;<b>R</b> reset &nbsp;<b>ESC</b> pause</div>
</div>

<div id="menu"></div>
<div id="fade"></div>

<script>

/* River Racer — shared utilities. Global namespace: RR */
window.RR = window.RR || {};

(function () {
  const U = {};

  U.clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  U.lerp = (a, b, t) => a + (b - a) * t;
  U.smoothstep = (a, b, x) => { const t = U.clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

  U.dist2 = (ax, az, bx, bz) => { const dx = ax - bx, dz = az - bz; return dx * dx + dz * dz; };

    let s = seed >>> 0;
    return function () {
      s |= 0; s = (s + 0x6D2B79F5) | 0;
      let t = Math.imul(s ^ (s >>> 15), 1 | s);

    out.roll = (U.waterHeight(x + e, z, t, amp) - h) / e;    // slope along +x

<script>
/* ===== js/core/engine.js ===== */
/* River Racer — renderer, scene, main loop, adaptive quality */
(function () {
  const E = { SKIP_REFLECT: 1, autoQuality: true };
  E.setAutoQuality = function (on) { E.autoQuality = on; };
  let renderer, scene, camera;
  let updateFns = [];
  let last = 0, simTime = 0, running = false;
  let fpsEMA = 60, qualityTimer = 0, pixelScale = 1;
  const MAX_PR = Math.min(window.devicePixelRatio || 1, 2);

  E.init = function () {
    const canvas = document.getElementById('gl');
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(MAX_PR);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.95;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.shadowMap.autoUpdate = true;

    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.5, 9000);
    camera.position.set(0, 40, 120);
    camera.layers.enable(E.SKIP_REFLECT);   // main view shows everything; the reflection cam skips layer 1

    // golden-hour key light from the west (sun low over the river canyon)
    const sun = new THREE.DirectionalLight(0xffdcae, 1.55);
    sun.position.set(-0.72, 0.38, -0.16).multiplyScalar(1400);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.near = 200; sun.shadow.camera.far = 3200;
    sun.shadow.camera.left = -320; sun.shadow.camera.right = 320;
    sun.shadow.camera.top = 320; sun.shadow.camera.bottom = -320;
    sun.shadow.bias = -0.0004;
    sun.shadow.normalBias = 2.0;
    sun.layers.enable(E.SKIP_REFLECT);      // lights must reach layer-1 objects too (layers gate illumination)
    scene.add(sun);
    scene.add(sun.target);
    E.sun = sun;

    const hemi = new THREE.HemisphereLight(0xcfe3f0, 0x44505c, 0.68);
    hemi.layers.enable(E.SKIP_REFLECT);
    scene.add(hemi);
    E.hemi = hemi;

    scene.fog = new THREE.Fog(0xd8c9a8, 900, 4200);

    window.addEventListener('resize', onResize);

    E.renderer = renderer; E.scene = scene; E.camera = camera;

    if (RR.Reflect) RR.Reflect.init();
    if (RR.Post) RR.Post.init(renderer);
  };

  function onResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setPixelRatio(MAX_PR * pixelScale);
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  // shadow camera follows a world position (the player) so the map stays sharp
  E.trackShadow = function (x, z) {
    E.sun.target.position.set(x, 0, z);
    E.sun.position.set(x - 0.72 * 1400, 0.38 * 1400, z - 0.16 * 1400);
  };

  E.onUpdate = function (fn) { updateFns.push(fn); };

  E.start = function () {
    if (running) return;
    running = true;
    last = performance.now();
    renderer.setAnimationLoop(tick);
  };

  let warpBank = 0;                       // seconds of instant simulation requested by the test API
  E.warp = function (sec) { warpBank += sec; };
  E.fps = function () { return fpsEMA; };
  E.time = function () { return simTime; };

  function step(dt) {
    simTime += dt;
    for (let i = 0; i < updateFns.length; i++) updateFns[i](dt, simTime);
  }

  function tick(now) {
    let dt = Math.min(0.05, (now - last) / 1000);
    last = now;

    const inst = 1000 / Math.max(1, now - (tick._p || now - 16));
    tick._p = now;
    fpsEMA = fpsEMA * 0.95 + Math.min(120, inst) * 0.05;

    // adaptive quality: hold ~60fps on modest GPUs, restore full quality when there's headroom.
    // Degrades gently in order (resolution → reflections → bloom → shadows) and recovers with hysteresis.
    qualityTimer += dt;
    if (qualityTimer > 1.5) {
      qualityTimer = 0;
      if (E.autoQuality) {
        if (fpsEMA < 47 && pixelScale > 0.55) { pixelScale = Math.max(0.55, pixelScale - 0.15); onResize(); }
        else if (fpsEMA > 57 && pixelScale < 1) { pixelScale = Math.min(1, pixelScale + 0.1); onResize(); }
        if (RR.Reflect) { if (fpsEMA < 40 && RR.Reflect.enabled) RR.Reflect.enabled = false; else if (fpsEMA > 54 && !RR.Reflect.enabled) RR.Reflect.enabled = true; }
        if (RR.Post) { if (fpsEMA < 32 && RR.Post.enabled) RR.Post.enabled = false; else if (fpsEMA > 50 && !RR.Post.enabled) RR.Post.enabled = true; }
        if (fpsEMA < 26 && renderer.shadowMap.enabled) { renderer.shadowMap.enabled = false; E.sun.castShadow = false; }
        else if (fpsEMA > 52 && !renderer.shadowMap.enabled) { renderer.shadowMap.enabled = true; E.sun.castShadow = true; }
      }
    }

    if (warpBank > 0) {
      // burn warp time in fixed sub-steps so physics stays sane during tests
      const h = 1 / 60;
      let spent = 0;
      while (spent < warpBank && spent < 12) { step(h); spent += h; }
      warpBank = Math.max(0, warpBank - spent);
    }
    step(dt);

    if (RR.Reflect && RR.Reflect.enabled) RR.Reflect.update(renderer, scene, camera);
    if (RR.Post && RR.Post.enabled) RR.Post.render(renderer, scene, camera);
    else renderer.render(scene, camera);
  }

  RR.Engine = E;
})();

</script>
<script>
/* ===== js/core/reflect.js ===== */
/* River Racer — planar reflections: a mirror camera renders the world across the
   water plane (y=0) into a texture the water shader samples. Real skyline mirroring. */
(function () {
  const R = { enabled: true };
  let rt, vcam, ready = false;

  const reflectorPos = new THREE.Vector3();
  const camPos = new THREE.Vector3();
  const rot = new THREE.Matrix4();
  const normal = new THREE.Vector3();
  const view = new THREE.Vector3();
  const look = new THREE.Vector3();
  const target = new THREE.Vector3();
  const textureMatrix = new THREE.Matrix4();

  // half-res is plenty — the reflection is rippled and blended, so the cost saving is invisible
  function size() { return [Math.max(256, (window.innerWidth * 0.5) | 0), Math.max(256, (window.innerHeight * 0.5) | 0)]; }

  R.init = function () {
    const [w, h] = size();
    rt = new THREE.WebGLRenderTarget(w, h, { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter });
    rt.texture.encoding = THREE.sRGBEncoding;    // capture screen-space colours to match the water output
    vcam = new THREE.PerspectiveCamera();
    R.texture = rt.texture;
    R.textureMatrix = textureMatrix;
    ready = true;
    window.addEventListener('resize', () => { const [w2, h2] = size(); rt.setSize(w2, h2); });
  };

  R.update = function (renderer, scene, camera) {
    if (!ready || !R.enabled) return;
    const W = RR.Water;
    if (!W || !W.material) return;

    reflectorPos.set(0, 0, 0);
    camPos.setFromMatrixPosition(camera.matrixWorld);
    rot.extractRotation(camera.matrixWorld);
    normal.set(0, 1, 0);

    view.subVectors(reflectorPos, camPos);
    if (view.dot(normal) > 0) return;                 // camera underwater — skip
    view.reflect(normal).negate().add(reflectorPos);

    look.set(0, 0, -1).applyMatrix4(rot).add(camPos);
    target.subVectors(reflectorPos, look);
    target.reflect(normal).negate().add(reflectorPos);

    vcam.position.copy(view);
    vcam.up.set(0, 1, 0).applyMatrix4(rot).reflect(normal);
    vcam.lookAt(target);
    vcam.far = camera.far;
    vcam.aspect = camera.aspect;
    vcam.updateMatrixWorld();
    vcam.projectionMatrix.copy(camera.projectionMatrix);

    textureMatrix.set(0.5, 0, 0, 0.5, 0, 0.5, 0, 0.5, 0, 0, 0.5, 0.5, 0, 0, 0, 1);
    textureMatrix.multiply(vcam.projectionMatrix).multiply(vcam.matrixWorldInverse);

    // hide the water itself (and its heavy spray) while capturing the mirror
    const wv = W.group ? W.group.visible : true;
    if (W.group) W.group.visible = false;
    const shadowWas = renderer.shadowMap.autoUpdate;
    renderer.shadowMap.autoUpdate = false;            // reuse last frame's shadow map
    const prev = renderer.getRenderTarget();
    renderer.setRenderTarget(rt);
    renderer.clear();
    renderer.render(scene, vcam);
    renderer.setRenderTarget(prev);
    renderer.shadowMap.autoUpdate = shadowWas;
    if (W.group) W.group.visible = wv;

    const u = W.material.uniforms;
    u.uReflect.value = rt.texture;
    u.uReflectMatrix.value.copy(textureMatrix);
    u.uReflectStrength.value = 0.62;
  };

  RR.Reflect = R;
})();

</script>
<script>
/* ===== js/core/post.js ===== */
/* River Racer — bloom. Capture the scene exactly as it hits the screen, extract the
   bright bits, gaussian-blur them, and add them back for a golden-hour glow.
   Works in display (sRGB) space so the existing colour grade is preserved. */
(function () {
  const P = { enabled: true };
  let sceneRT, brightRT, blurA, blurB, quad, cam, brightMat, blurMat, compMat, ready = false;

  const VS = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;
  const BRIGHT = `
    uniform sampler2D tDiffuse; uniform float threshold; varying vec2 vUv;
    void main(){
      vec3 c = texture2D(tDiffuse, vUv).rgb;
      float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
      float k = max(0.0, l - threshold) / max(l, 1e-4);
      gl_FragColor = vec4(c * k * smoothstep(0.0, 0.25, l - threshold + 0.15), 1.0);
    }`;
  const BLUR = `
    uniform sampler2D tDiffuse; uniform vec2 dir; uniform vec2 res; varying vec2 vUv;
    void main(){
      vec2 px = dir / res;
      vec3 s = texture2D(tDiffuse, vUv).rgb * 0.2270;
      s += texture2D(tDiffuse, vUv + px * 1.3846).rgb * 0.3162;
      s += texture2D(tDiffuse, vUv - px * 1.3846).rgb * 0.3162;
      s += texture2D(tDiffuse, vUv + px * 3.2308).rgb * 0.0702;
      s += texture2D(tDiffuse, vUv - px * 3.2308).rgb * 0.0702;
      gl_FragColor = vec4(s, 1.0);
    }`;
  const COMP = `
    uniform sampler2D tScene; uniform sampler2D tBloom; uniform float strength; varying vec2 vUv;
    void main(){
      vec3 c = texture2D(tScene, vUv).rgb;
      vec3 b = texture2D(tBloom, vUv).rgb;
      gl_FragColor = vec4(c + b * strength, 1.0);
    }`;

  function rt(w, h, srgb) {
    const t = new THREE.WebGLRenderTarget(w, h, { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: true });
    if (srgb) t.texture.encoding = THREE.sRGBEncoding;   // capture the screen-space image
    return t;
  }

  P.init = function () {
    const w = window.innerWidth, h = window.innerHeight, hw = Math.max(1, w >> 1), hh = Math.max(1, h >> 1);
    sceneRT = rt(w, h, true);
    brightRT = rt(hw, hh, false); blurA = rt(hw, hh, false); blurB = rt(hw, hh, false);
    cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2));
    brightMat = new THREE.ShaderMaterial({ uniforms: { tDiffuse: { value: null }, threshold: { value: 0.75 } }, vertexShader: VS, fragmentShader: BRIGHT, depthTest: false, depthWrite: false });
    blurMat = new THREE.ShaderMaterial({ uniforms: { tDiffuse: { value: null }, dir: { value: new THREE.Vector2() }, res: { value: new THREE.Vector2(hw, hh) } }, vertexShader: VS, fragmentShader: BLUR, depthTest: false, depthWrite: false });
    compMat = new THREE.ShaderMaterial({ uniforms: { tScene: { value: null }, tBloom: { value: null }, strength: { value: 0.85 } }, vertexShader: VS, fragmentShader: COMP, depthTest: false, depthWrite: false });
    window.addEventListener('resize', P.resize);
    ready = true;
  };

  P.resize = function () {
    if (!ready) return;
    const w = window.innerWidth, h = window.innerHeight, hw = Math.max(1, w >> 1), hh = Math.max(1, h >> 1);
    sceneRT.setSize(w, h); brightRT.setSize(hw, hh); blurA.setSize(hw, hh); blurB.setSize(hw, hh);
    blurMat.uniforms.res.value.set(hw, hh);
  };

  function pass(renderer, mat, target) {
    quad.material = mat;
    renderer.setRenderTarget(target);
    renderer.clear();
    renderer.render(quad, cam);
  }

  P.render = function (renderer, scene, camera) {
    if (!ready) { renderer.render(scene, camera); return; }
    renderer.setRenderTarget(sceneRT);
    renderer.clear();
    renderer.render(scene, camera);

    brightMat.uniforms.tDiffuse.value = sceneRT.texture; pass(renderer, brightMat, brightRT);
    blurMat.uniforms.tDiffuse.value = brightRT.texture; blurMat.uniforms.dir.value.set(1, 0); pass(renderer, blurMat, blurA);
    blurMat.uniforms.tDiffuse.value = blurA.texture; blurMat.uniforms.dir.value.set(0, 1); pass(renderer, blurMat, blurB);
    blurMat.uniforms.tDiffuse.value = blurB.texture; blurMat.uniforms.dir.value.set(1, 0); pass(renderer, blurMat, blurA);
    blurMat.uniforms.tDiffuse.value = blurA.texture; blurMat.uniforms.dir.value.set(0, 1); pass(renderer, blurMat, blurB);

    compMat.uniforms.tScene.value = sceneRT.texture;
    compMat.uniforms.tBloom.value = blurB.texture;
    quad.material = compMat;
    renderer.setRenderTarget(null);
    renderer.render(quad, cam);
  };

  RR.Post = P;
})();

</script>
<script>
/* ===== js/core/theme.js ===== */
/* River Racer — day / night theming. Swaps lights, fog, sky, water colours, the
   buildings' lit-window glow and the street-lamp lights. Toggle with N. */
(function () {
  const T = { mode: 'day', lamps: [], _mesh: null, greenRiver: false };
  // St. Patrick's Day dye — vivid emerald, applied to the river uniforms only (the lake stays blue)
  const GREEN_DEEP = 0x0a5c2a, GREEN_SHALLOW = 0x14b34a;

  // world builders call this with each lamp globe position so night can light them up
  T.addLamp = function (x, y, z, c) { T.lamps.push([x, y, z, c || 0xffe6b0]); };

  T.buildLamps = function () {
    if (!T.lamps.length || T._mesh) return;
    const geoms = [], _c = new THREE.Color();
    for (const [x, y, z, c] of T.lamps) {
      const g = new THREE.SphereGeometry(0.55, 6, 5);
      g.translate(x, y, z);
      _c.setHex(c).convertSRGBToLinear();
      const n = g.attributes.position.count, col = new Float32Array(n * 3);
      for (let i = 0; i < n; i++) { col[i * 3] = _c.r; col[i * 3 + 1] = _c.g; col[i * 3 + 2] = _c.b; }
      g.setAttribute('color', new THREE.BufferAttribute(col, 3));
      geoms.push(g);
    }
    // chunked so a single buffer never gets silly
    T._mesh = new THREE.Group();
    for (let i = 0; i < geoms.length; i += 1500) {
      const m = new THREE.Mesh(RR.City.mergeGeoms(geoms.slice(i, i + 1500)), new THREE.MeshBasicMaterial({ vertexColors: true }));
      T._mesh.add(m);
    }
    T._mesh.visible = false;
    RR.Engine.scene.add(T._mesh);
  };

  const PRESETS = {
    day: {
      sun: 0xffdcae, sunI: 1.55, hemi: 0xcfe3f0, hemiG: 0x44505c, hemiI: 0.68, exposure: 0.95,
      fog: 0xd8c9a8, fogNear: 900, fogFar: 4200, night: 0, emissive: 0, fireworks: false, lamps: false,

      sky: { zenith: 0x3a4674, mid: 0xcf847a, horizon: 0xff8438, west: 0xff5230 },
      water: { deepR: 0x35474c, shalR: 0x7a7658, deepL: 0x354458, shalL: 0x88745e, skyLo: 0xffa856, skyHi: 0x9a6478, fog: 0xecb182 },

    night: {
      sun: 0x9fb2dc, sunI: 0.5, hemi: 0x27324c, hemiG: 0x0d121c, hemiI: 0.4, exposure: 1.35,
      fog: 0x0a1120, fogNear: 650, fogFar: 3500, night: 1, emissive: 1.15, fireworks: true, lamps: true,
      sky: { zenith: 0x2e6a9e, mid: 0x9fc4d8, horizon: 0xffd9a0, west: 0xffb35c },
      water: { deepR: 0x081820, shalR: 0x123038, deepL: 0x06111d, shalL: 0x102838, skyLo: 0x1c2740, skyHi: 0x080f1c, fog: 0x0a1120 },
    },
  };
  const ORDER = ['day', 'sunset', 'night'];

  T.apply = function (mode) {

    const E = RR.Engine;

      u.cHorizon.value.setHex(P.sky.horizon); u.cWest.value.setHex(P.sky.west);
      if (RR.Sky.setNight) RR.Sky.setNight(P.night);
    }

    if (RR.Water && RR.Water.material) {
      const u = RR.Water.material.uniforms, c = P.water;
      u.uDeepRiver.value.setHex(c.deepR); u.uShallowRiver.value.setHex(c.shalR);
      u.uDeepLake.value.setHex(c.deepL); u.uShallowLake.value.setHex(c.shalL);
      u.uSkyLow.value.setHex(c.skyLo); u.uSkyHigh.value.setHex(c.skyHi);
      u.uFogColor.value.setHex(c.fog);
    }

    RR.City.material().emissiveIntensity = P.emissive;
    if (T._mesh) T._mesh.visible = P.lamps;
    if (RR.Fireworks) RR.Fireworks.setActive(P.fireworks);

    // re-apply the St. Patrick's Day dye last so it survives every day/sunset/night switch
    if (T.greenRiver && RR.Water && RR.Water.material) {
      const u = RR.Water.material.uniforms;
      const dim = mode === 'night' ? 0.45 : 1;
      u.uDeepRiver.value.setHex(GREEN_DEEP).multiplyScalar(dim);
      u.uShallowRiver.value.setHex(GREEN_SHALLOW).multiplyScalar(dim);
    }
  };

  T.toggle = function () {
    const i = (ORDER.indexOf(T.mode) + 1) % ORDER.length;
    T.apply(ORDER[i]);
    return T.mode;
  };

  T.toggleGreenRiver = function () {
    T.greenRiver = !T.greenRiver;
    T.apply(T.mode);
    return T.greenRiver;
  };

  RR.Theme = T;
})();

<script>
/* ===== js/core/input.js ===== */
/* River Racer — keyboard / gamepad / touch input */
(function () {
  const I = { throttle: 0, brake: 0, steer: 0, boost: false, raw: {} };
  const keys = {};

  window.addEventListener('keydown', (e) => {
    keys[e.code] = true;
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
    if (I.onKey) I.onKey(e.code);
  });
  window.addEventListener('keyup', (e) => { keys[e.code] = false; });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

  I.pressed = (code) => !!keys[code];

  // touch: left half steers by horizontal position, right half is throttle
  let touchSteer = 0, touchThrottle = 0;
  const touches = new Map();
  function readTouches() {
    touchSteer = 0; touchThrottle = 0;
    touches.forEach((t) => {
      if (t.x < window.innerWidth * 0.5) touchSteer = RR.U.clamp((t.x / (window.innerWidth * 0.25)) - 1, -1, 1);
      else touchThrottle = 1;
    });
  }
  window.addEventListener('touchstart', (e) => { for (const t of e.changedTouches) touches.set(t.identifier, { x: t.clientX, y: t.clientY }); readTouches(); }, { passive: true });
  window.addEventListener('touchmove', (e) => { for (const t of e.changedTouches) { const o = touches.get(t.identifier); if (o) { o.x = t.clientX; o.y = t.clientY; } } readTouches(); }, { passive: true });
  window.addEventListener('touchend', (e) => { for (const t of e.changedTouches) touches.delete(t.identifier); readTouches(); }, { passive: true });
  window.addEventListener('touchcancel', (e) => { for (const t of e.changedTouches) touches.delete(t.identifier); readTouches(); }, { passive: true });

  I.update = function (dt) {
    let th = 0, br = 0, st = 0, bo = false;
    if (keys.KeyW || keys.ArrowUp) th = 1;
    if (keys.KeyS || keys.ArrowDown) br = 1;
    if (keys.KeyA || keys.ArrowLeft) st -= 1;
    if (keys.KeyD || keys.ArrowRight) st += 1;
    bo = !!(keys.ShiftLeft || keys.ShiftRight);

    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (const p of pads) {
      if (!p || !p.connected) continue;
      const ax = p.axes[0] || 0;
      if (Math.abs(ax) > 0.12) st = RR.U.clamp(st + ax, -1, 1);
      const rt = p.buttons[7] ? p.buttons[7].value : 0;
      const lt = p.buttons[6] ? p.buttons[6].value : 0;
      if (rt > 0.05) th = Math.max(th, rt);
      if (lt > 0.05) br = Math.max(br, lt);
      if (p.buttons[0] && p.buttons[0].pressed) th = 1;
      if (p.buttons[2] && p.buttons[2].pressed) bo = true;
      break;
    }

    if (touchThrottle > 0) th = Math.max(th, touchThrottle);
    if (touchSteer !== 0) st = RR.U.clamp(st + touchSteer, -1, 1);

    // analog feel on digital keys
    const rate = 6.5;
    I.throttle = RR.U.damp(I.throttle, th, rate, dt);
    I.brake = RR.U.damp(I.brake, br, rate, dt);
    I.steer = RR.U.damp(I.steer, st, st === 0 ? 9 : 5.5, dt);
    I.boost = bo;
  };

  RR.Input = I;
})();

</script>
<script>
/* ===== js/core/camera.js ===== */
/* River Racer — chase camera with lag, banking, hull cam, and attract-mode flythrough */
(function () {
  const C = {};
  const U = () => RR.U;
  let mode = 0;                 // 0 chase, 1 close, 2 hood/hull
  const MODES = [
    { back: 16.5, up: 6.2, lookUp: 1.6, fov: 62, stiff: 4.2 },
    { back: 9.5, up: 3.4, lookUp: 1.3, fov: 66, stiff: 6.0 },
    { back: -0.6, up: 1.55, lookUp: 1.1, fov: 74, stiff: 22 },
  ];
  const pos = new THREE.Vector3(0, 30, 60);
  const look = new THREE.Vector3();
  let shake = 0;

  C.cycle = function () { mode = (mode + 1) % MODES.length; };
  C.kick = function (amount) { shake = Math.min(1.4, shake + amount); };
  C.setMode = function (m) { mode = m; };

  C.snapTo = function (boat) {
    const m = MODES[mode];
    const s = Math.sin(boat.heading), c = Math.cos(boat.heading);
    pos.set(boat.pos.x - s * m.back, boat.pos.y + m.up, boat.pos.z - c * m.back);
  };

  C.follow = function (boat, dt) {
    const cam = RR.Engine.camera;
    const m = MODES[mode];
    const s = Math.sin(boat.heading), c = Math.cos(boat.heading);
    // pull back a touch with speed for a sense of velocity
    const spd = Math.hypot(boat.vel.x, boat.vel.z);
    const back = m.back + spd * 0.10;
    const up = m.up + spd * 0.02;

    const tx = boat.pos.x - s * back;
    const tz = boat.pos.z - c * back;
    let ty = boat.pos.y + up;
    // duck under bridge decks so the span never cuts across the view —
    // unless the boat is jumping OVER the bridge, in which case the camera flies with it
    if (RR.Bridges && RR.Bridges.duckY) {
      const deckA = RR.Bridges.duckY(tx, tz), deckB = RR.Bridges.duckY(boat.pos.x, boat.pos.z);
      const deck = Math.min(deckA, deckB);
      if (isFinite(deck) && boat.pos.y < deck - 1.5) ty = Math.min(ty, deck - 1.4);
    }
    const k = 1 - Math.exp(-m.stiff * dt);
    pos.x += (tx - pos.x) * k;
    pos.z += (tz - pos.z) * k;
    pos.y += (ty - pos.y) * (1 - Math.exp(-(m.stiff + 3) * dt));

    // never sink the camera under the waves
    const wh = U().waterHeight(pos.x, pos.z, RR.Engine.time(), 1) + 0.9;
    if (pos.y < wh) pos.y = wh;

    look.set(boat.pos.x + s * 10, boat.pos.y + m.lookUp, boat.pos.z + c * 10);

    if (shake > 0.003) {
      const t = performance.now() * 0.045;
      pos.x += Math.sin(t * 1.7) * shake * 0.5;
      pos.y += Math.sin(t * 2.3 + 1) * shake * 0.35;
      look.x += Math.sin(t * 2.9 + 2) * shake * 0.7;
      shake *= Math.exp(-4.5 * dt);
    }

    cam.position.copy(pos);
    cam.lookAt(look);
    // subtle roll with the boat lean
    cam.rotation.z += boat.visRoll * (mode === 2 ? 0.55 : 0.16);
    const fovT = m.fov + spd * 0.16 + boat.boostHeat * 10;   // boost = a real FOV punch
    if (Math.abs(cam.fov - fovT) > 0.05) { cam.fov += (fovT - cam.fov) * Math.min(1, 3 * dt); cam.updateProjectionMatrix(); }
  };

  // menu background: drift down the Main Stem canyon
  let flyD = 400;
  C.flyover = function (dt, path) {
    const cam = RR.Engine.camera;
    flyD += dt * 26;
    if (flyD > path.len - 260) flyD = 150;
    const a = U().pathAt(path, flyD, C._fa || (C._fa = {}));
    const b = U().pathAt(path, flyD + 190, C._fb || (C._fb = {}));
    const t = RR.Engine.time();
    const y = 16 + Math.sin(t * 0.11) * 7;
    const side = Math.sin(t * 0.07) * a.w * 0.5;
    cam.position.set(a.x - a.tz * side, y, a.z + a.tx * side);
    cam.lookAt(b.x, 6 + Math.sin(t * 0.13) * 4, b.z);
    if (cam.fov !== 58) { cam.fov = 58; cam.updateProjectionMatrix(); }
  };

  RR.Camera = C;
})();

</script>
<script>
/* ===== js/world/river.js ===== */
/* River Racer — river channel network: resampled paths, water queries, land collision */
(function () {
  const R = { paths: {} };
  const U = () => RR.U;

  // obstacles boats collide with (bridge piers, buoys, pier walls): {x, z, r}
  R.obstacles = [];
  // axis-aligned or rotated wall segments: {ax, az, bx, bz, pad}
  R.walls = [];

  R.init = function () {
    const C = window.CHICAGO;
    for (const key in C.paths) {
      R.paths[key] = U().resamplePath(C.paths[key], 8);
      R.paths[key].name = key;
    }
    // lake open-water boundary: east of this x the world is lake (no bank collision)
    R.lakeWestX = C.lake.openWaterX;
    R.lakeShoreZTop = C.lake.shoreZNorth;   // north shoreline of the lake play area
    R.lakeShoreZBot = C.lake.shoreZSouth;
    R.lakeEastX = C.lake.eastX;
  };

  // Is (x,z) in the open lake basin?
  R.inLake = function (x, z) {
    return x > R.lakeWestX && x < R.lakeEastX && z > R.lakeShoreZTop && z < R.lakeShoreZBot;
  };

  // Signed clearance to navigable water: positive = inside water, negative = on land.
  // Also returns push normal toward water. Checks all channels + lake basin.
  const tmp = {};
  R.waterQuery = function (x, z, hintObj) {
    let best = null;
    for (const key in R.paths) {
      const p = R.paths[key];
      const hint = hintObj ? hintObj[key] : null;
      const q = U().pathNearest(p, x, z, hint, hint != null ? 30 : 0);
      if (hintObj) hintObj[key] = q.idx;
      const clear = q.w - q.dist;                    // >0 inside channel
      if (!best || clear > best.clear) {
        best = tmp; tmp.clear = clear; tmp.path = key; tmp.q = q;
        // normal pointing from bank toward channel centerline
        const nx = (q.x - x), nz = (q.z - z);
        const nl = Math.max(1e-6, Math.hypot(nx, nz));
        tmp.nx = nx / nl; tmp.nz = nz / nl;
      }
    }
    if (R.inLake(x, z)) {
      const dW = x - R.lakeWestX, dE = R.lakeEastX - x, dN = z - R.lakeShoreZTop, dS = R.lakeShoreZBot - z;
      const m = Math.min(dW, dE, dN, dS);
      if (!best || m > best.clear) {
        best = tmp; tmp.clear = m; tmp.path = 'lake'; tmp.q = null;
        tmp.nx = (m === dW) ? 1 : (m === dE) ? -1 : 0;
        tmp.nz = (m === dN) ? 1 : (m === dS) ? -1 : 0;
      }
    }
    return best;
  };

  R.addObstacle = function (x, z, r) { R.obstacles.push({ x, z, r }); };
  R.addWall = function (ax, az, bx, bz, pad) { R.walls.push({ ax, az, bx, bz, pad: pad || 1.5 }); };

  // resolve collision against point obstacles / walls; returns {nx,nz,pen} or null
  R.hitObstacle = function (x, z, radius) {
    for (let i = 0; i < R.obstacles.length; i++) {
      const o = R.obstacles[i];
      const dx = x - o.x, dz = z - o.z;
      const rr = o.r + radius;
      const d2 = dx * dx + dz * dz;
      if (d2 < rr * rr) {
        const d = Math.max(1e-5, Math.sqrt(d2));
        return { nx: dx / d, nz: dz / d, pen: rr - d };
      }
    }
    for (let i = 0; i < R.walls.length; i++) {
      const w = R.walls[i];
      const abx = w.bx - w.ax, abz = w.bz - w.az;
      const ab2 = abx * abx + abz * abz;
      let t = ((x - w.ax) * abx + (z - w.az) * abz) / Math.max(1e-9, ab2);
      t = U().clamp(t, 0, 1);
      const qx = w.ax + abx * t, qz = w.az + abz * t;
      const dx = x - qx, dz = z - qz;
      const d2 = dx * dx + dz * dz;
      const rr = w.pad + radius;
      if (d2 < rr * rr) {
        const d = Math.max(1e-5, Math.sqrt(d2));
        return { nx: dx / d, nz: dz / d, pen: rr - d };
      }
    }
    return null;
  };

  // wave amplitude by locale: calm in the river canyon, rolling out on the lake
  R.waveAmp = function (x, z) {
    if (!R.inLake(x, z)) return 1;
    const t = U().smoothstep(R.lakeWestX, R.lakeWestX + 420, x);
    return 1 + t * 2.3;
  };

  RR.River = R;
})();

</script>
<script>
/* ===== js/world/sky.js ===== */
/* River Racer — sky dome, sun disc, clouds, distant haze */
(function () {
  const S = {};

  S.init = function () {
    const scene = RR.Engine.scene;

    // gradient dome: golden hour looking west, cool zenith
    const geo = new THREE.SphereGeometry(4600, 24, 16);
    const mat = new THREE.ShaderMaterial({
      side: THREE.BackSide,
      depthWrite: false,
      fog: false,
      uniforms: {
        cZenith: { value: new THREE.Color(0x2e6a9e) },
        cMid: { value: new THREE.Color(0x9fc4d8) },
        cHorizon: { value: new THREE.Color(0xffd9a0) },
        cWest: { value: new THREE.Color(0xffb35c) },
        sunDir: { value: new THREE.Vector3(-0.72, 0.20, -0.16).normalize() },
        uNight: { value: 0 },
        nZenith: { value: new THREE.Color(0x030711) },
        nMid: { value: new THREE.Color(0x0a1428) },
        nHorizon: { value: new THREE.Color(0x223049) },
      },
      vertexShader: `
        varying vec3 vDir;
        void main() {
          vDir = normalize(position);
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }`,
      fragmentShader: `
        uniform vec3 cZenith, cMid, cHorizon, cWest, sunDir;
        uniform vec3 nZenith, nMid, nHorizon;
        uniform float uNight;
        varying vec3 vDir;
        void main() {
          float h = clamp(vDir.y, 0.0, 1.0);
          // smoother multi-band gradient: horizon -> mid -> mid/zenith blend -> zenith
          vec3 col = mix(cHorizon, cMid, smoothstep(0.0, 0.30, h));
          col = mix(col, mix(cMid, cZenith, 0.55), smoothstep(0.18, 0.46, h));
          col = mix(col, cZenith, smoothstep(0.40, 0.82, h));
          float sd = max(dot(normalize(vDir), sunDir), 0.0);
          float sunAmt = pow(sd, 4.0);
          // richer west tint hugging the horizon around the sun
          col = mix(col, cWest, sunAmt * (1.0 - h * 0.6));
          col = mix(col, cWest * vec3(1.06, 0.92, 0.80), pow(sd, 2.0) * pow(1.0 - h, 3.0) * 0.45);
          // soft warm glow lobe where the sun sits low
          col += vec3(1.0, 0.62, 0.30) * pow(sd, 3.5) * pow(1.0 - h, 2.5) * 0.35;
          // warm horizon band that glows into the golden hour
          col = mix(col, vec3(1.0, 0.78, 0.5), pow(1.0 - h, 6.0) * 0.35 * (0.4 + 0.6 * sunAmt));
          float disc = smoothstep(0.99900, 0.99955, sd);
          col += vec3(1.0, 0.9, 0.72) * disc * 3.4;          // bright disc — blooms
          float glow = pow(sd, 22.0);
          col += vec3(1.0, 0.74, 0.44) * glow * 0.85;
          float halo = pow(sd, 6.0);
          col += vec3(1.0, 0.6, 0.34) * halo * 0.28;

          // ---- night sky: dark gradient + warm city glow at the horizon + a moon ----
          if (uNight > 0.001) {
            vec3 nsky = mix(nHorizon, nMid, smoothstep(0.0, 0.34, h));
            nsky = mix(nsky, nZenith, smoothstep(0.14, 0.72, h));
            nsky = mix(nsky, vec3(0.32, 0.22, 0.14), pow(1.0 - h, 9.0) * 0.7);   // sodium-lit horizon haze
            // faint diagonal Milky-Way band across the upper sky
            float mwd = dot(normalize(vDir), normalize(vec3(0.62, 0.16, -0.55)));
            nsky += vec3(0.085, 0.10, 0.145) * exp(-mwd * mwd * 55.0) * smoothstep(0.06, 0.42, h);
            float moon = smoothstep(0.99920, 0.99965, sd);
            nsky += vec3(0.95, 0.96, 1.0) * moon * 2.6;
            nsky += vec3(0.5, 0.58, 0.82) * pow(sd, 60.0) * 0.4;
            col = mix(col, nsky, uNight);
          }
          gl_FragColor = vec4(col, 1.0);
        }`,
    });
    const dome = new THREE.Mesh(geo, mat);
    dome.renderOrder = -10;
    scene.add(dome);
    S.dome = dome;

    // sparse flat-bottomed cumulus as billboards, kept high and far
    const rng = RR.U.mulberry(7331);
    const cloudTex = RR.U.canvasTexture(256, 128, (ctx, w, h) => {
      ctx.clearRect(0, 0, w, h);
      for (let i = 0; i < 26; i++) {
        const cx = w * (0.18 + rng() * 0.64), cy = h * (0.35 + rng() * 0.28), r = 14 + rng() * 26;
        const g = ctx.createRadialGradient(cx, cy, 2, cx, cy, r);
        g.addColorStop(0, 'rgba(255,246,235,0.55)');
        g.addColorStop(1, 'rgba(255,246,235,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill();
      }
    });
    // wide soft stratus sheets — fewer, flatter, fainter lobes
    const stratusTex = RR.U.canvasTexture(256, 96, (ctx, w, h) => {
      ctx.clearRect(0, 0, w, h);
      for (let i = 0; i < 12; i++) {
        const cx = w * (0.12 + rng() * 0.76), cy = h * (0.38 + rng() * 0.24), r = 26 + rng() * 42;
        ctx.save();
        ctx.translate(cx, cy); ctx.scale(2.6, 1);
        const g = ctx.createRadialGradient(0, 0, 2, 0, 0, r);
        g.addColorStop(0, 'rgba(255,244,232,0.30)');
        g.addColorStop(1, 'rgba(255,244,232,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill();
        ctx.restore();
      }
    });
    const cGeo = new THREE.PlaneGeometry(1, 1);
    const cMat = new THREE.MeshBasicMaterial({ map: cloudTex, transparent: true, depthWrite: false, fog: false, opacity: 0.9 });
    const stMat = new THREE.MeshBasicMaterial({ map: stratusTex, transparent: true, depthWrite: false, fog: false, opacity: 0.75 });
    S.clouds = [];
    for (let i = 0; i < 14; i++) {
      const m = new THREE.Mesh(cGeo, cMat);
      const ang = rng() * Math.PI * 2, dist = 2400 + rng() * 1600;
      m.position.set(Math.cos(ang) * dist, 320 + rng() * 380, Math.sin(ang) * dist);
      const s = 500 + rng() * 700;
      m.scale.set(s, s * 0.42, 1);
      m.renderOrder = -9;
      scene.add(m);
      S.clouds.push(m);
    }
    // a handful of big soft stratus puffs at varied heights (same hide-at-night path)
    for (let i = 0; i < 6; i++) {
      const m = new THREE.Mesh(cGeo, stMat);
      const ang = rng() * Math.PI * 2, dist = 2600 + rng() * 1500;
      m.position.set(Math.cos(ang) * dist, 220 + rng() * 620, Math.sin(ang) * dist);
      const s = 1100 + rng() * 1300;
      m.scale.set(s, s * (0.18 + rng() * 0.12), 1);
      m.renderOrder = -9;
      scene.add(m);
      S.clouds.push(m);
    }

    // ---------- stars (hidden by day) ----------
    const starN = 1400, sPos = new Float32Array(starN * 3), sCol = new Float32Array(starN * 3);
    for (let i = 0; i < starN; i++) {
      // upper hemisphere of the dome
      const u = rng(), v = rng() * 0.9 + 0.06;
      const th = u * Math.PI * 2, ph = Math.acos(v);
      const r = 4400;
      sPos[i * 3] = r * Math.sin(ph) * Math.cos(th);
      sPos[i * 3 + 1] = r * Math.cos(ph);
      sPos[i * 3 + 2] = r * Math.sin(ph) * Math.sin(th);
      // varied brightness: mostly dim, a few bright, slight blue/warm cast
      const b = (rng() < 0.12 ? 0.75 + rng() * 0.25 : 0.25 + rng() * 0.45);
      const w = rng() * 0.12;
      sCol[i * 3] = b * (1.0 - w * 0.3);
      sCol[i * 3 + 1] = b;
      sCol[i * 3 + 2] = b * (1.0 + w) > 1 ? 1 : b * (1.0 + w);
    }
    const starGeo = new THREE.BufferGeometry();
    starGeo.setAttribute('position', new THREE.BufferAttribute(sPos, 3));
    starGeo.setAttribute('color', new THREE.BufferAttribute(sCol, 3));
    const starTex = RR.U.canvasTexture(32, 32, (ctx) => {
      const g = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
      g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.4, 'rgba(230,235,255,0.6)'); g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, 32, 32);
    });
    const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ size: 14, map: starTex, transparent: true, depthWrite: false, fog: false, sizeAttenuation: true, opacity: 0.95, vertexColors: true }));
    stars.renderOrder = -8; stars.visible = false; stars.frustumCulled = false;
    scene.add(stars);
    S.stars = stars;
    S.mat = mat;

    S.setNight = function (f) {
      mat.uniforms.uNight.value = f;
      stars.visible = f > 0.5;
      for (const c of S.clouds) c.visible = f < 0.5;   // clear night skies show the stars
    };

    RR.Engine.onUpdate((dt) => {
      const cam = RR.Engine.camera;
      dome.position.set(cam.position.x, 0, cam.position.z);
      stars.position.set(cam.position.x, 0, cam.position.z);
      for (const c of S.clouds) c.quaternion.copy(cam.quaternion);
    });
  };

  RR.Sky = S;
})();

<script>
/* ===== js/world/water.js ===== */
/* River Racer — water: river ribbons + lake sheet, one animated shader.
   Vertex displacement mirrors RR.U.waterHeight — keep the two in sync. */
(function () {
  const W = {};
  let mat;

  function buildMaterial() {
    const noiseTex = RR.U.canvasTexture(256, 256, (ctx, w, h) => {
      const rng = RR.U.mulberry(9182);
      const img = ctx.createImageData(w, h);
      for (let i = 0; i < w * h; i++) {
        const v = 110 + rng() * 145;
        img.data[i * 4] = v; img.data[i * 4 + 1] = v; img.data[i * 4 + 2] = v; img.data[i * 4 + 3] = 255;
      }
      ctx.putImageData(img, 0, 0);
    });
    noiseTex.wrapS = noiseTex.wrapT = THREE.RepeatWrapping;

    mat = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 },
        uNoise: { value: noiseTex },
        uSunDir: { value: new THREE.Vector3(-0.72, 0.38, -0.16).normalize() },
        uCamPos: { value: new THREE.Vector3() },
        // Chicago River green vs Lake Michigan blue
        uDeepRiver: { value: new THREE.Color(0x1e4d43) },
        uShallowRiver: { value: new THREE.Color(0x3e7d68) },
        uDeepLake: { value: new THREE.Color(0x14496b) },
        uShallowLake: { value: new THREE.Color(0x2e7d9e) },
        uSkyLow: { value: new THREE.Color(0xffd9a0) },
        uSkyHigh: { value: new THREE.Color(0x74a9c9) },
        uFogColor: { value: new THREE.Color(0xd8c9a8) },
        uFogNear: { value: 900 },
        uFogFar: { value: 4200 },
        uReflect: { value: null },
        uReflectMatrix: { value: new THREE.Matrix4() },
        uReflectStrength: { value: 0 },
        uNumBoats: { value: 0 },
        uBoats: { value: Array.from({ length: 8 }, () => new THREE.Vector4()) },
      },
      vertexShader: `
        uniform float uTime;
        attribute float aAmp;      // wave amplitude scale per vertex (river 1, lake ~3.3)
        attribute float aShore;    // 0 center of channel .. 1 at banks (foam band)
        attribute float aLake;     // 0 river, 1 lake (color blend)
        uniform mat4 uReflectMatrix;
        varying vec3 vWorld;
        varying float vShore;
        varying float vLake;
        varying float vAmp;
        varying float vH;
        varying vec4 vReflectCoord;
        float wh(vec2 p, float t, float amp) {
          return amp * (
            0.055 * sin(p.x * 0.11 + t * 1.35) +
            0.045 * sin(p.y * 0.13 - t * 1.02 + p.x * 0.04) +
            0.032 * sin((p.x + p.y) * 0.061 + t * 0.71) +
            0.022 * sin(p.x * 0.23 - p.y * 0.17 + t * 2.1));
        }
        void main() {
          vec4 wp = modelMatrix * vec4(position, 1.0);
          float hh = wh(wp.xz, uTime, aAmp);
          wp.y += hh;
          vH = hh;
          vWorld = wp.xyz;
          vShore = aShore;
          vLake = aLake;
          vAmp = aAmp;
          vReflectCoord = uReflectMatrix * wp;
          gl_Position = projectionMatrix * viewMatrix * wp;
        }`,
      fragmentShader: `
        uniform float uTime;
        uniform sampler2D uNoise;
        uniform vec3 uSunDir, uCamPos;
        uniform vec3 uDeepRiver, uShallowRiver, uDeepLake, uShallowLake, uSkyLow, uSkyHigh;
        uniform vec3 uFogColor;
        uniform float uFogNear, uFogFar;
        uniform sampler2D uReflect;
        uniform float uReflectStrength;
        uniform int uNumBoats;
        uniform vec4 uBoats[8];
        varying vec3 vWorld;
        varying float vShore;
        varying float vLake;
        varying float vAmp;
        varying float vH;
        varying vec4 vReflectCoord;
        void main() {
          // ripple normal from three scrolling noise octaves + analytic swell
          vec2 uv1 = vWorld.xz * 0.055 + vec2(uTime * 0.028, uTime * 0.021);
          vec2 uv2 = vWorld.xz * 0.11 - vec2(uTime * 0.031, -uTime * 0.017);
          vec2 uv3 = vWorld.xz * 0.27 + vec2(uTime * 0.071, -uTime * 0.058);
          float n1 = texture2D(uNoise, uv1).r;
          float n2 = texture2D(uNoise, uv2).r;
          float n3 = texture2D(uNoise, uv3).r;   // fine octave: close-up sparkle detail
          float bump = (n1 + n2 - 1.0) + (n3 - 0.5) * 0.4;
          float sx = cos(vWorld.x * 0.11 + uTime * 1.35) * 0.0061 * vAmp + bump * 0.10;
          float sz = cos(vWorld.z * 0.13 - uTime * 1.02) * 0.0059 * vAmp + (n2 - 0.5) * 0.12 + (n3 - 0.5) * 0.05;
          vec3 N = normalize(vec3(-sx * 2.4, 1.0, -sz * 2.4));

          vec3 V = normalize(uCamPos - vWorld);
          float grazing = pow(1.0 - max(dot(N, V), 0.0), 4.8);
          float fresnel = 0.04 + 0.96 * grazing;

          vec3 deep = mix(uDeepRiver, uDeepLake, vLake);
          vec3 shallow = mix(uShallowRiver, uShallowLake, vLake);
          vec3 base = mix(deep, shallow, clamp(0.35 + bump * 0.5, 0.0, 1.0));
          // shallower, lighter, greener water near the banks
          base = mix(base, base * 1.12 + vec3(0.03, 0.06, 0.04), smoothstep(0.55, 1.0, vShore) * 0.5 * (1.0 - vLake));
          // brighten swell crests a touch, darken body at glancing angles (glossier read)
          base *= (1.0 + max(vH, 0.0) * 0.45) * (1.0 - grazing * 0.22);

          // sky reflection tint: warmer when looking toward the low western sun
          float westness = clamp(dot(normalize(vec3(V.x, 0.0, V.z)), vec3(0.72, 0.0, 0.16)), 0.0, 1.0);
          vec3 sky = mix(uSkyHigh, uSkyLow, westness * 0.85 + 0.1);

          // real planar reflection of the skyline, rippled by the wave normal
          vec3 refl = sky;
          if (uReflectStrength > 0.0 && vReflectCoord.w > 0.0) {
            vec2 ruv = vReflectCoord.xy / vReflectCoord.w;
            ruv += N.xz * 0.04 + vec2(bump * 0.015);
            if (ruv.x > 0.005 && ruv.x < 0.995 && ruv.y > 0.005 && ruv.y < 0.995) {
              vec3 rc = texture2D(uReflect, ruv).rgb;
              refl = mix(sky, rc, uReflectStrength);
            }
          }

          vec3 col = mix(base, refl, fresnel * 0.9);

          // sun glitter: tight warm spec, sparkle twinkles with the fast fine octave
          vec3 H = normalize(uSunDir + V);
          float ndh = max(dot(N, H), 0.0);
          float spec = pow(ndh, 360.0) * 3.0;
          float sparkle = pow(ndh, 1100.0) * 6.0 * smoothstep(0.56, 0.72, n3) * (0.6 + 0.8 * n2);
          col += vec3(1.0, 0.80, 0.50) * (spec + sparkle);

          // foam grain: break flat white up with the mid noise octave
          float foamGrain = 0.6 + 0.8 * n2;

          // bank foam: soft lapping line at the seawalls
          float foamBand = smoothstep(0.78, 0.97, vShore + bump * 0.14 + 0.05 * sin(uTime * 1.7 + vWorld.x * 0.5 + vWorld.z * 0.4));
          col = mix(col, vec3(0.90, 0.91, 0.87), clamp(foamBand * foamGrain, 0.0, 1.0) * 0.5 * (1.0 - vLake * 0.55));

          // bow-wave foam churned up around each moving boat
          float boatFoam = 0.0;
          for (int i = 0; i < 8; i++) {
            if (i >= uNumBoats) break;
            vec4 b = uBoats[i];
            vec2 d = vWorld.xz - b.xy;
            float dist = length(d);
            vec2 fwd = vec2(sin(b.w), cos(b.w));
            float f = dot(d, fwd);
            boatFoam += smoothstep(6.0, 1.2, dist) * (0.35 + 0.65 * smoothstep(-1.5, 3.5, f)) * b.z;
          }
          boatFoam = clamp(boatFoam * foamGrain, 0.0, 1.0);
          col = mix(col, vec3(0.95, 0.95, 0.91), boatFoam * 0.55);

          float fog = smoothstep(uFogNear, uFogFar, distance(uCamPos, vWorld));
          col = mix(col, uFogColor, fog);
          gl_FragColor = vec4(col, 1.0);
        }`,
    });
    return mat;
  }

  // 3-lane ribbon (left bank, center, right bank) so foam only lives at the edges
  function buildRibbon3(path, isLakePath) {
    const n = path.n;
    const L = 3;
    const verts = new Float32Array(n * L * 3);
    const amp = new Float32Array(n * L);
    const shore = new Float32Array(n * L);
    const lake = new Float32Array(n * L);
    for (let i = 0; i < n; i++) {
      const i0 = Math.max(0, i - 1), i1 = Math.min(n - 1, i + 1);
      let tx = path.x[i1] - path.x[i0], tz = path.z[i1] - path.z[i0];
      const tl = Math.max(1e-6, Math.hypot(tx, tz)); tx /= tl; tz /= tl;
      const wHalf = path.w[i] + 2.5;
      const lx = -tz, lz = tx;
      const a = RR.River.waveAmp(path.x[i], path.z[i]);
      const lk = isLakePath ? RR.U.smoothstep(RR.River.lakeWestX - 150, RR.River.lakeWestX + 300, path.x[i]) : 0;
      for (let l = 0; l < L; l++) {
        const f = l / (L - 1) * 2 - 1;      // -1, 0, 1
        const vi = i * L + l;
        verts[vi * 3] = path.x[i] + lx * wHalf * f;
        verts[vi * 3 + 1] = 0;
        verts[vi * 3 + 2] = path.z[i] + lz * wHalf * f;
        amp[vi] = a;
        shore[vi] = Math.abs(f);
        lake[vi] = lk;
      }
    }
    const idx = [];
    for (let i = 0; i < n - 1; i++) {
      for (let l = 0; l < L - 1; l++) {
        const a = i * L + l, b = i * L + l + 1, c = (i + 1) * L + l, d = (i + 1) * L + l + 1;
        idx.push(a, b, c, b, d, c);
      }
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(verts, 3));
    geo.setAttribute('aAmp', new THREE.BufferAttribute(amp, 1));
    geo.setAttribute('aShore', new THREE.BufferAttribute(shore, 1));
    geo.setAttribute('aLake', new THREE.BufferAttribute(lake, 1));
    geo.setIndex(idx);
    return geo;
  }

  W.init = function () {
    buildMaterial();
    const scene = RR.Engine.scene;
    const R = RR.River;
    const group = new THREE.Group();       // all water meshes, so reflection can hide them
    scene.add(group);
    W.group = group;
    W.material = mat;

    for (const key in R.paths) {
      if (key.startsWith('lake')) continue;               // the lake sheet covers open water
      const geo = buildRibbon3(R.paths[key], key === 'main');
      const mesh = new THREE.Mesh(geo, mat);
      mesh.frustumCulled = true;
      mesh.receiveShadow = false;
      group.add(mesh);
    }

    // lake sheet: big segmented grid so vertex waves read properly.
    // starts 30m shy of the river-ribbon end and rides 9cm lower to dodge z-fighting at the seam
    const lakeW = R.lakeEastX - (R.lakeWestX - 30) + 300;
    const lakeH = R.lakeShoreZBot - R.lakeShoreZTop + 600;
    const gx = Math.min(150, Math.floor(lakeW / 22)), gz = Math.min(150, Math.floor(lakeH / 22));
    const lg = new THREE.PlaneGeometry(lakeW, lakeH, gx, gz);
    lg.rotateX(-Math.PI / 2);
    lg.translate(R.lakeWestX - 30 + lakeW / 2, -0.09, R.lakeShoreZTop - 300 + lakeH / 2);
    const cnt = lg.attributes.position.count;
    const amp = new Float32Array(cnt), shoreA = new Float32Array(cnt), lakeA = new Float32Array(cnt);
    for (let i = 0; i < cnt; i++) {
      const x = lg.attributes.position.getX(i), z = lg.attributes.position.getZ(i);
      amp[i] = RR.U.lerp(1.2, 3.3, RR.U.smoothstep(R.lakeWestX, R.lakeWestX + 500, x));
      shoreA[i] = 0;
      lakeA[i] = RR.U.smoothstep(R.lakeWestX - 100, R.lakeWestX + 350, x);
    }
    lg.setAttribute('aAmp', new THREE.BufferAttribute(amp, 1));
    lg.setAttribute('aShore', new THREE.BufferAttribute(shoreA, 1));
    lg.setAttribute('aLake', new THREE.BufferAttribute(lakeA, 1));
    const lakeMesh = new THREE.Mesh(lg, mat);
    group.add(lakeMesh);

    RR.Engine.onUpdate((dt, t) => {
      mat.uniforms.uTime.value = t;
      mat.uniforms.uCamPos.value.copy(RR.Engine.camera.position);
    });
  };

  RR.Water = W;
})();

<script>
/* ===== js/world/city.js ===== */
/* River Racer — generic city fabric: filler towers, ground, riverwalk, seawalls, street lights.
   Everything merges into a handful of draw calls. */
(function () {
  const CITY = {};
  const U = () => RR.U;

  // ---------- minimal geometry merger (three.min has no BufferGeometryUtils) ----------
  function mergeGeoms(geoms) {
    let vCount = 0, iCount = 0;
    for (const g of geoms) { vCount += g.attributes.position.count; iCount += g.index ? g.index.count : g.attributes.position.count; }
    const pos = new Float32Array(vCount * 3);
    const nor = new Float32Array(vCount * 3);
    const uv = new Float32Array(vCount * 2);
    const col = new Float32Array(vCount * 3);
    const idx = new (vCount > 65535 ? Uint32Array : Uint16Array)(iCount);
    let vo = 0, io = 0;
    for (const g of geoms) {
      const n = g.attributes.position.count;
      pos.set(g.attributes.position.array, vo * 3);
      nor.set(g.attributes.normal.array, vo * 3);
      if (g.attributes.uv) uv.set(g.attributes.uv.array, vo * 2);
      if (g.attributes.color) col.set(g.attributes.color.array, vo * 3);
      else for (let i = 0; i < n * 3; i++) col[vo * 3 + i] = 1;
      if (g.index) { const a = g.index.array; for (let i = 0; i < a.length; i++) idx[io++] = a[i] + vo; }
      else for (let i = 0; i < n; i++) idx[io++] = vo + i;
      vo += n;
    }
    const out = new THREE.BufferGeometry();
    out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    out.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
    out.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
    out.setAttribute('color', new THREE.BufferAttribute(col, 3));
    out.setIndex(new THREE.BufferAttribute(idx, 1));
    return out;
  }
  CITY.mergeGeoms = mergeGeoms;

  const _c = new THREE.Color();
  function tintGeom(geo, hex, jitter, rng) {
    // vertex colors bypass three's sRGB handling — convert here or everything washes out pastel
    _c.setHex(hex).convertSRGBToLinear();
    if (jitter) {
      const f = 1 + (rng() - 0.5) * jitter;
      _c.r = U().clamp(_c.r * f, 0, 1); _c.g = U().clamp(_c.g * f, 0, 1); _c.b = U().clamp(_c.b * f, 0, 1);
    }
    const n = geo.attributes.position.count;
    const col = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) { col[i * 3] = _c.r; col[i * 3 + 1] = _c.g; col[i * 3 + 2] = _c.b; }
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
    return geo;
  }
  CITY.tintGeom = tintGeom;

  // box with UVs scaled so the facade texture repeats per floor / per bay
  function towerGeom(w, h, d, x, z, rotY) {
    const g = new THREE.BoxGeometry(w, h, d);
    const uv = g.attributes.uv;
    const FLOOR = 3.6, BAY = 3.0;
    // three.js box UV islands: sides need (width/BAY, height/FLOOR)
    for (let i = 0; i < uv.count; i++) {
      const face = Math.floor(i / 4);          // 6 faces × 4 verts
      let su = BAY, sv = FLOOR;
      let du = (face < 2) ? d : (face < 4) ? w : w;   // +x,-x → d; +y,-y (roof) → w; +z,-z → w
      let dv = (face === 2 || face === 3) ? d : h;
      uv.setXY(i, uv.getX(i) * du / su, uv.getY(i) * dv / sv);
    }
    g.translate(x, h / 2, z);
    if (rotY) {
      g.translate(-x, 0, -z);
      g.rotateY(rotY);
      g.translate(x, 0, z);
    }
    return g;
  }
  CITY.towerGeom = towerGeom;

  // shared facade texture: window grid with sun-struck variance
  function facadeTexture() {
    const tex = U().canvasTexture(128, 128, (ctx, w, h) => {
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h);
      const rng = U().mulberry(52);
      // one tile = one bay × one floor; draw 4×4 window cells for texture density
      for (let y = 0; y < 4; y++) {
        for (let x = 0; x < 4; x++) {
          const glint = rng();
          const v = glint > 0.86 ? 235 : 38 + rng() * 42;
          const warm = glint > 0.86;
          ctx.fillStyle = warm ? `rgb(${v},${v * 0.92 | 0},${v * 0.7 | 0})` : `rgb(${v * 0.65 | 0},${v * 0.78 | 0},${v * 0.85 | 0})`;
          ctx.fillRect(x * 32 + 5, y * 32 + 6, 22, 18);
        }
      }
    });
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    return tex;
  }

  // emissive map aligned to the facade UVs: a scatter of lit windows for night mode
  function nightWindows() {
    const tex = U().canvasTexture(128, 128, (ctx, w, h) => {
      ctx.fillStyle = '#000000'; ctx.fillRect(0, 0, w, h);
      const rng = U().mulberry(313);
      for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) {
        if (rng() < 0.5) {
          ctx.fillStyle = rng() < 0.72 ? '#ffcf82' : '#bcd6ff';   // warm interiors, some cool
          ctx.fillRect(x * 32 + 5, y * 32 + 6, 22, 18);
        }
      }
    });
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    return tex;
  }

  let cityMat;
  CITY.material = function () {
    if (!cityMat) {
      cityMat = new THREE.MeshLambertMaterial({
        vertexColors: true, map: facadeTexture(),
        emissiveMap: nightWindows(), emissive: 0xffffff, emissiveIntensity: 0,   // theme raises this at night
      });
    }
    return cityMat;
  };

  // solid (windowless) vertex-colored material for walls, roofs, piers
  let flatMat;
  CITY.flatMaterial = function () {
    if (!flatMat) flatMat = new THREE.MeshLambertMaterial({ vertexColors: true });
    return flatMat;
  };

  // Upper Wacker / street grid sits a full level (~20 ft) above the river, matching the
  // bascule bridge decks — the river runs in a trough down at water level.
  const GROUND_Y = 6.0;
  CITY.GROUND_Y = GROUND_Y;

  // keep-out: signed clearance to the NEAREST water edge — channels AND the lake basin.
  // >0 on dry land, <0 over water. Nothing but the bridges is ever built where this is <0.
  function landClearance(x, z) {
    let best = Infinity;
    for (const key in RR.River.paths) {
      if (key.startsWith('lake')) continue;
      const p = RR.River.paths[key];
      const q = U().pathNearest(p, x, z);
      const c = q.dist - q.w - 2.5;           // 2.5m past the seawall still counts as water
      if (c < best) best = c;
    }
    const R = RR.River;
    if (x > R.lakeWestX && x < R.lakeEastX && z > R.lakeShoreZTop && z < R.lakeShoreZBot) {
      const depth = Math.min(x - R.lakeWestX, R.lakeEastX - x, z - R.lakeShoreZTop, R.lakeShoreZBot - z);
      if (-depth < best) best = -depth;
    }
    return best;
  }
  CITY.landClearance = landClearance;         // shared with scenery.js

  CITY.init = function () {
    const scene = RR.Engine.scene;
    const C = window.CHICAGO;
    const rng = U().mulberry(C.generic.seed);

    // snapped bridge crossing points, so riverwalk dressing keeps clear of the decks
    const bridgePts = C.bridges.map((b) => {
      const p = RR.River.paths[b.branch];
      const q = U().pathNearest(p, b.x, b.z);
      return { x: q.x, z: q.z };
    });
    function nearBridge(x, z, r) {
      for (const bp of bridgePts) if (U().dist2(x, z, bp.x, bp.z) < r * r) return true;
      return false;
    }

    // ---------- ground: bank aprons hugging every channel + a coarse cell grid with
    // water cells skipped (the river must stay open water — no slab over the channels) ----------
    const groundTex = U().canvasTexture(256, 256, (ctx, w, h) => {
      ctx.fillStyle = '#565b61'; ctx.fillRect(0, 0, w, h);
      const g = U().mulberry(99);
      for (let i = 0; i < 900; i++) {
        const v = 75 + g() * 28;
        ctx.fillStyle = `rgba(${v},${v + 4},${v + 8},0.5)`;
        ctx.fillRect(g() * w, g() * h, 2, 2);
      }
      ctx.strokeStyle = 'rgba(28,30,34,0.85)';
      ctx.lineWidth = 6;
      for (let i = 0; i <= 2; i++) {
        ctx.beginPath(); ctx.moveTo(i * 128, 0); ctx.lineTo(i * 128, h); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i * 128); ctx.lineTo(w, i * 128); ctx.stroke();
      }
    });
    groundTex.wrapS = groundTex.wrapT = THREE.RepeatWrapping;
    const groundMat = new THREE.MeshLambertMaterial({ map: groundTex, color: 0x9aa0a6 });

    // apron ribbons: from just behind the seawall out to ~130m, following each channel exactly.
    // Every rib is keep-out gated (inner + outer corner must be dry land) so the strip never
    // sweeps over the neighbouring branches' water at the Wolf Point confluence, and it is
    // sampled at every resample point so it hugs concave bends instead of chording across them.
    const openX = C.lake.openWaterX;
    const apronGeoms = [];
    for (const key in RR.River.paths) {
      if (key.startsWith('lake')) continue;
      const p = RR.River.paths[key];
      for (const s of [-1, 1]) {
        const verts = [], uvs = [], idx = [];
        let vi = 0, prevOK = false;
        for (let i = 0; i < p.n; i++) {
          const i0 = Math.max(0, i - 1), i1 = Math.min(p.n - 1, i + 1);
          let tx = p.x[i1] - p.x[i0], tz = p.z[i1] - p.z[i0];
          const tl = Math.max(1e-6, Math.hypot(tx, tz)); tx /= tl; tz /= tl;
          const inner = p.w[i] + 9, outer = p.w[i] + 130;   // upper street sits behind the lower promenade
          const ix = p.x[i] - tz * inner * s, iz = p.z[i] + tx * inner * s;
          const ox = p.x[i] - tz * outer * s, oz = p.z[i] + tx * outer * s;
          const ok = landClearance(ix, iz) > 0 && landClearance(ox, oz) > 0 && ix < openX - 6 && ox < openX - 6;
          verts.push(ix, GROUND_Y, iz, ox, GROUND_Y, oz);
          uvs.push(ix / 32, iz / 32, ox / 32, oz / 32);
          if (vi >= 2 && ok && prevOK) {
            if (s === 1) idx.push(vi - 2, vi - 1, vi, vi - 1, vi + 1, vi);
            else idx.push(vi - 2, vi, vi - 1, vi - 1, vi, vi + 1);
          }
          prevOK = ok;
          vi += 2;
        }
        const g = new THREE.BufferGeometry();
        g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(verts), 3));
        g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(uvs), 2));
        g.setIndex(idx);
        g.computeVertexNormals();
        apronGeoms.push(g);
      }
    }
    for (const g of apronGeoms) {
      const m = new THREE.Mesh(g, groundMat);
      m.receiveShadow = true;
      scene.add(m);
    }

    // cell grid: 64m tiles across the whole map, skipping any tile that touches water
    {
      const CELL = 64;
      const cells = [];
      const x0 = -4300, x1 = C.lake.openWaterX, z0 = -3600, z1 = 4200;
      for (let x = x0; x < x1; x += CELL) {
        for (let z = z0; z < z1; z += CELL) {
          const cx = x + CELL / 2, cz = z + CELL / 2;
          if (landClearance(cx, cz) < CELL * 0.95) continue;   // near/over water → apron territory
          const g = new THREE.PlaneGeometry(CELL, CELL);
          g.rotateX(-Math.PI / 2);
          g.translate(cx, GROUND_Y - 0.04, cz);
          const uv = g.attributes.uv;
          for (let i = 0; i < uv.count; i++) uv.setXY(i, (cx + (uv.getX(i) - 0.5) * CELL) / 32, (cz + (uv.getY(i) - 0.5) * CELL) / 32);
          cells.push(g);
        }
      }
      for (let i = 0; i < cells.length; i += 900) {
        const m = new THREE.Mesh(mergeGeoms(cells.slice(i, i + 900)), groundMat);
        m.receiveShadow = true;
        scene.add(m);
      }
    }

    // (the water's-edge retaining wall + lower promenade are built by RR.Riverwalk)

    // shared dressing/greenery builders (flat vertex-colored geometry)
    function treeAt(arr, px, pz, scale) {
      const s = scale || 1;
      const trunk = new THREE.CylinderGeometry(0.22 * s, 0.32 * s, 2.6 * s, 5);
      trunk.translate(px, GROUND_Y + 1.3 * s, pz);
      tintGeom(trunk, 0x4a3524, 0, rng); arr.push(trunk);
      const crown = new THREE.SphereGeometry((2.1 + rng() * 1.5) * s, 7, 6);
      crown.scale(1, 0.82, 1);
      crown.translate(px, GROUND_Y + (4.0 + rng()) * s, pz);
      tintGeom(crown, rng() > 0.5 ? 0x4d7a3a : 0x5d8a42, 0.22, rng); arr.push(crown);
    }
    function benchAt(arr, px, pz, tx, tz) {
      const ang = Math.atan2(tx, tz), nx = -tz, nz = tx;
      const seat = new THREE.BoxGeometry(2.0, 0.18, 0.6);
      seat.rotateY(ang); seat.translate(px, GROUND_Y + 0.5, pz);
      tintGeom(seat, 0x5a4a30, 0.12, rng); arr.push(seat);
      const back = new THREE.BoxGeometry(2.0, 0.5, 0.12);
      back.rotateY(ang); back.translate(px + nx * 0.24, GROUND_Y + 0.8, pz + nz * 0.24);
      tintGeom(back, 0x5a4a30, 0.12, rng); arr.push(back);
    }
    function lampAt(arr, px, pz) {
      const post = new THREE.CylinderGeometry(0.12, 0.17, 5.0, 5);
      post.translate(px, GROUND_Y + 2.5, pz);
      tintGeom(post, 0x2c2f33, 0, rng); arr.push(post);
      const arm = new THREE.BoxGeometry(0.9, 0.12, 0.12);
      arm.translate(px, GROUND_Y + 4.9, pz);
      tintGeom(arm, 0x2c2f33, 0, rng); arr.push(arm);
      const lamp = new THREE.SphereGeometry(0.3, 6, 5);
      lamp.translate(px + 0.38, GROUND_Y + 4.8, pz);
      tintGeom(lamp, 0xffe6b0, 0, rng); arr.push(lamp);
      if (RR.Theme) RR.Theme.addLamp(px + 0.38, GROUND_Y + 4.8, pz, 0xffe6b0);
    }
    function planterAt(arr, px, pz) {
      const box = new THREE.BoxGeometry(2.4, 0.9, 1.2);
      box.translate(px, GROUND_Y + 0.45, pz);
      tintGeom(box, 0x8f8672, 0.1, rng); arr.push(box);
      const green = new THREE.BoxGeometry(2.2, 0.6, 1.0);
      green.translate(px, GROUND_Y + 1.15, pz);
      tintGeom(green, 0x4d7a3a, 0.2, rng); arr.push(green);
    }

    // ---------- generic tower field on the street grid ----------
    const BLOCK = 96, STREET = 22;
    const palettes = [0x8f9aa3, 0x76828c, 0xa39a8a, 0x5d666e, 0x8c8478, 0x9fa8b0, 0x6b7480, 0xb0a798, 0xc4b9a4, 0x7d8891, 0x9a8f7c];
    const geoms = [];          // window-mapped tower shells
    const detailGeoms = [];    // flat: rooftop clutter, park ground, plazas
    const dressGeoms = [];     // flat: trees, lamps, benches, planters
    const lm = C.landmarks;
    const cx0 = C.generic.loopCenter.x, cz0 = C.generic.loopCenter.z;

    function roofClutter(cx, cz, topY, w, d) {
      if (rng() > 0.42) {
        const pw = w * (0.26 + rng() * 0.34), pd = d * (0.26 + rng() * 0.34), ph = 2.5 + rng() * 6;
        const g = new THREE.BoxGeometry(pw, ph, pd);
        g.translate(cx + (rng() - 0.5) * w * 0.35, topY + ph / 2, cz + (rng() - 0.5) * d * 0.35);
        tintGeom(g, 0x666c72, 0.12, rng); detailGeoms.push(g);
      }
      if (rng() > 0.6) {
        const rad = 1.2 + rng() * 1.3, th = 2.4 + rng() * 3;
        const tx = cx + (rng() - 0.5) * w * 0.4, tz = cz + (rng() - 0.5) * d * 0.4;
        const g = new THREE.CylinderGeometry(rad, rad, th, 8);
        g.translate(tx, topY + th / 2, tz);
        tintGeom(g, 0x4a4034, 0.12, rng); detailGeoms.push(g);
      }
      if (rng() > 0.72) {
        const ah = 4 + rng() * 12;
        const g = new THREE.CylinderGeometry(0.1, 0.22, ah, 4);
        g.translate(cx + (rng() - 0.5) * w * 0.25, topY + ah / 2, cz + (rng() - 0.5) * d * 0.25);
        tintGeom(g, 0x2c2f33, 0, rng); detailGeoms.push(g);
      }
    }

    // place one building, footprint keep-out checked; returns true if placed
    function placeBuilding(bxx, bzz, w, d, dLoop, loRise) {
      const halfDiag = Math.hypot(w, d) * 0.5;
      if (landClearance(bxx, bzz) < halfDiag + 2) return false;          // whole footprint must be on dry land
      if (bxx > C.lake.openWaterX - halfDiag - 18) return false;
      let h;
      if (loRise) h = 14 + rng() * 46;
      else h = (20 + rng() * rng() * 165) * U().clamp(1.4 - dLoop / 2100, 0.3, 1.2);
      if (landClearance(bxx, bzz) < 70) h = Math.min(h, 34 + rng() * 60);  // step down toward the water
      h = Math.max(11, h);
      const g = towerGeom(w, h, d, bxx, bzz, 0);
      g.translate(0, GROUND_Y, 0);
      tintGeom(g, palettes[Math.floor(rng() * palettes.length)], 0.22, rng);
      geoms.push(g);
      // ground-floor retail band (darker base) for street-level realism
      const band = towerGeom(w + 0.4, 4.5, d + 0.4, bxx, bzz, 0);
      band.translate(0, GROUND_Y, 0);
      tintGeom(band, 0x3b3f45, 0.1, rng); geoms.push(band);
      // parapet cap for a crisp roofline (flat, so it doesn't glow at night)
      const cap = new THREE.BoxGeometry(w + 0.8, 1.3, d + 0.8);
      cap.translate(bxx, GROUND_Y + h - 0.35, bzz);
      tintGeom(cap, 0x565c64, 0.14, rng); detailGeoms.push(cap);
      if (h > 90 && rng() > 0.4) {                                       // setback crown
        const g2 = towerGeom(w * 0.62, h * 0.28, d * 0.62, bxx, bzz, 0);
        g2.translate(0, GROUND_Y + h, 0);
        tintGeom(g2, palettes[Math.floor(rng() * palettes.length)], 0.22, rng);
        geoms.push(g2);
        roofClutter(bxx, bzz, GROUND_Y + h + h * 0.28, w * 0.62, d * 0.62);
      } else {
        roofClutter(bxx, bzz, GROUND_Y + h, w, d);
      }
      return true;
    }

    // ---- riverfront building wall: a near-continuous line of mid/low-rise right along the banks ----
    for (const key in RR.River.paths) {
      if (key.startsWith('lake')) continue;
      const p = RR.River.paths[key];
      for (let i = 3; i < p.n - 3; i += 3) {
        let tx = p.x[i + 1] - p.x[i - 1], tz = p.z[i + 1] - p.z[i - 1];
        const tl = Math.max(1e-6, Math.hypot(tx, tz)); tx /= tl; tz /= tl;
        for (const s of [-1, 1]) {
          const w = 26 + rng() * 26, d = 24 + rng() * 22;
          const set = p.w[i] + 15 + d / 2;                               // just behind street + riverwalk
          const bxx = p.x[i] - tz * set * s, bzz = p.z[i] + tx * set * s;
          if (bxx > C.lake.openWaterX - 40) continue;
          if (nearBridge(bxx, bzz, 26)) continue;                        // leave room for the bridge approaches
          let ok = true;
          for (const l of lm) if (Math.abs(l.x - bxx) < l.w / 2 + 30 && Math.abs(l.z - bzz) < l.d / 2 + 30) { ok = false; break; }
          if (ok) placeBuilding(bxx, bzz, w, d, Math.hypot(bxx - cx0, bzz - cz0), rng() < 0.5);
        }
      }
    }

    // ---- Loop street-grid fill behind the riverfront ----
    for (let gx = -24; gx <= 26; gx++) {
      for (let gz = -22; gz <= 24; gz++) {
        const bx = gx * (BLOCK + STREET), bz = gz * (BLOCK + STREET);
        if (bx > C.lake.openWaterX - 90) continue;                       // lakefront park stays open
        const clear = landClearance(bx, bz);
        if (clear < 4) continue;                                         // block center basically in the water
        let owned = false;
        for (const l of lm) {
          if (Math.abs(l.x - bx) < (l.w / 2 + 58) && Math.abs(l.z - bz) < (l.d / 2 + 58)) { owned = true; break; }
        }
        if (owned) continue;
        const dLoop = Math.hypot(bx - cx0, bz - cz0);
        if (dLoop > 3100) continue;

        // occasional pocket park right at the water (much rarer now).
        // Size the lawn to the local clearance so a waterside block never overhangs the channel.
        if (clear < 45 && rng() < 0.1) {
          const ps = Math.min(BLOCK - 8, clear * 2 - 4);
          if (ps >= 20) {
            const tile = new THREE.PlaneGeometry(ps, ps);
            tile.rotateX(-Math.PI / 2); tile.translate(bx, GROUND_Y + 0.02, bz);
            tintGeom(tile, 0x4f7a3e, 0.14, rng); detailGeoms.push(tile);
            for (let t = 0; t < 5 + (rng() * 5 | 0); t++) {
              const tx = bx + (rng() - 0.5) * (ps - 8), tz = bz + (rng() - 0.5) * (ps - 8);
              if (landClearance(tx, tz) > 3) treeAt(dressGeoms, tx, tz, 0.9 + rng() * 0.4);
            }
          }
          continue;
        }

        const density = U().clamp(1.45 - dLoop / 2800, 0.45, 1);
        if (rng() > density + 0.35) continue;                            // skip far fewer blocks
        const nBld = 2 + Math.floor(rng() * 2.6 * density);              // pack the block
        for (let b = 0; b < nBld; b++) {
          const w = 20 + rng() * 44, d = 20 + rng() * 44;
          const ox = (rng() - 0.5) * (BLOCK - w), oz = (rng() - 0.5) * (BLOCK - d);
          placeBuilding(bx + ox, bz + oz, w, d, dLoop, rng() < 0.28);
        }
      }
    }

    // ---------- distant skyline: silhouette ring so the horizon reads as a full city ----------
    {
      const backGeoms = [];
      const bRng = U().mulberry(7777);
      for (let a = 0; a < Math.PI * 2; a += 0.04) {
        const rad = 2750 + bRng() * 1000;
        const bx = cx0 + Math.cos(a) * rad, bz = cz0 + Math.sin(a) * rad;
        if (bx > C.lake.openWaterX + 150) continue;                      // leave the lake horizon open
        const w = 30 + bRng() * 64, d = 30 + bRng() * 64;
        const h = 44 + bRng() * bRng() * 250;
        const g = new THREE.BoxGeometry(w, h, d);
        g.translate(bx, h / 2, bz);
        tintGeom(g, 0x8793a0, 0.14, bRng);
        backGeoms.push(g);
      }
